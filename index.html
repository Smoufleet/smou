  if(document.getElementById("overlay")||document.getElementById("rowmenu"))return true;
  var act=document.activeElement;
  if(act&&(act.tagName==="INPUT"||act.tagName==="TEXTAREA"||act.tagName==="SELECT"))return true;
  return false;
}
function setLive(ok,txt){
  // reflect realtime connection on the resting indicator, but never stomp an in-progress save
  var el=document.getElementById("saveInd");
  if(el&&el.classList.contains("saving"))return;
  if(ok)setSave("",txt||("Live · "+roleLabel(ROLE)));
  else setSave("err",txt||"Reconnecting…");
}
// pull the full server state and reconcile (catch up on anything missed while disconnected/asleep)
function sbReconcile(){
  if(!SB_ON||!SB||!USER||_reconciling)return Promise.resolve();
  _reconciling=true;
  var sel=_deltaOK?"collection,id,data,updated_at":"collection,id,data";
  return sbAllRecords(sel).then(function(res){
    _reconciling=false;
    if(res.error||!res.data)return;
    if(dataSig(res.data)===_lastSig){bumpLastSync(res.data);flushPending();flushPendingDel();return;} // server unchanged → no rebuild, no blink, no scroll reset
    applyRows(res.data);bumpLastSync(res.data);flushPending();flushPendingDel();
    calmRefresh();
  }).catch(function(){_reconciling=false;});
}
// cheap delta fetch — only rows changed since lastSync; merges them in (used on focus/reconnect when available)
function sbDelta(){
  if(!SB_ON||!SB||!USER||_reconciling)return Promise.resolve();
  _reconciling=true;
  return sbAllRecords("collection,id,data,updated_at",function(q){return q.gt("updated_at",lastSync);}).then(function(res){
    _reconciling=false;
    if(res.error){_deltaOK=false;return sbReconcile();} // any issue → safe full reconcile
    var rows=res.data||[];
    if(rows.length){applyDelta(rows);bumpLastSync(rows);calmRefresh();}
    flushPending();flushPendingDel();
  }).catch(function(){_reconciling=false;});
}
// pick the cheap path when we can, else the full safety-net check
function sbSync(){ if(_deltaOK&&lastSync)return sbDelta(); return sbReconcile(); }
function broadcastChange(coll,id,data,eventType){
  if(!_rtChan||!_rtLive)return;
  try{
    _rtChan.send({type:"broadcast",event:"record_change",payload:{collection:coll,id:id,data:data,eventType:eventType,ts:Date.now()}});
  }catch(e){}
}
function applyRealtimeRecord(coll,id,data,eventType){
  if(!coll){
    for(var c in COLLSET){
      var cd=COLLSET[c];
      var ca=STATE[cd[0]]&&STATE[cd[0]][cd[1]];
      if(ca&&ca.some(function(x){return x&&x.id===id;})){ coll=c; break; }
    }
  }
  var dest=COLLSET[coll];
  if(!dest)return;
  var arr=STATE[dest[0]][dest[1]];
  if(!arr)return;
  var i=arr.findIndex(function(x){return x&&x.id===id;});
  if(eventType==="DELETE"){
    if(i>=0)arr.splice(i,1);
    delete shadow[coll+"/"+id];
  } else if(data){
    if(i>=0)arr[i]=data;
    else arr.push(data);
    shadow[coll+"/"+id]=JSON.stringify(data);
  }
  cacheSave();
  calmRefresh();
}
function sbSubscribe(){
  if(!SB_ON||!SB)return;
  try{if(_rtChan){try{SB.removeChannel(_rtChan);}catch(e){}_rtChan=null;}}catch(e){}
  try{
    _rtChan=SB.channel("records-sync",{config:{broadcast:{self:false}}})
      .on("broadcast",{event:"record_change"},function(p){
        var pl=p&&p.payload;if(!pl)return;
        applyRealtimeRecord(pl.collection,pl.id,pl.data,pl.eventType);
      })
      .on("postgres_changes",{event:"*",schema:"public",table:"records"},function(p){
        var isDel=p.eventType==="DELETE";
        var row=isDel?p.old:p.new;if(!row)return;
        applyRealtimeRecord(row.collection,row.id,row.data,p.eventType);
      })
      .subscribe(function(status){
        if(status==="SUBSCRIBED"){var wasLive=_rtGotFirst;_rtLive=true;_rtRetry=0;_rtGotFirst=true;setLive(true);if(wasLive)sbSync();}
        else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"||status==="CLOSED"){
          _rtLive=false;setLive(false);
          if(!_rtScheduled){_rtScheduled=true;var delay=Math.min(30000,1000*Math.pow(2,_rtRetry++));
            setTimeout(function(){_rtScheduled=false;if(SB_ON&&USER&&!_rtLive)sbSubscribe();},delay);}
        }
      });
  }catch(e){}
}
// wire up the always-on safety nets exactly once
function sbWireLive(){
  if(_liveWired)return;_liveWired=true;
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"){sbSync();if(!_rtLive)sbSubscribe();}
  });
  window.addEventListener("online",function(){setLive(false,"Reconnecting…");flushPendingDel();sbSync();sbSubscribe();});
  window.addEventListener("offline",function(){_rtLive=false;setLive(false,"Offline · saving on device");});
  // heartbeat: retry queued writes, revive realtime, and periodically run a FULL safety-net check
  var _hb=0;
  setInterval(function(){
    if(!SB_ON||!SB||!USER)return;
    if(PENDING&&PENDING.length)flushPending();
    if(PENDING_DEL&&PENDING_DEL.length)flushPendingDel();
    if(AUDITQ&&AUDITQ.length)flushAudit();
    if(document.visibilityState==="visible"&&!_rtLive&&!_rtScheduled)sbSubscribe();
    // every ~5 min: full reconcile — guarantees deletes & any missed change self-heal (nothing ever stays lost/stale)
    if(document.visibilityState==="visible"&&(++_hb%12===0))sbReconcile();
  },25000);
}

/* ============ AUTH (Supabase) ============ */
function ensureProfile(user){
  return SB.from("profiles").select("id,role,name").eq("id",user.id).then(function(res){
    if(res.error)throw res.error;
    if(res.data&&res.data.length)return res.data[0].role||"viewer";
    return SB.from("profiles").insert({id:user.id,email:user.email,name:(user.email||"").split("@")[0],role:"dataentry"}).then(function(){return "dataentry";}).catch(function(){return "viewer";});
  });
}
function onAuthed(user){
  USER=user;setSave("saving","Loading…");
  ensureProfile(user).then(function(role){
    ROLE=role||"viewer";applyRole();hideLogin();if(!_hadCache)showSplash("Loading your data…");
    var _done=false;var _to=setTimeout(function(){if(!_done){setSave("err","DB timeout — check Console");renderApp();}},18000);
    sbLoad().then(function(){_done=true;clearTimeout(_to);renderApp();setSave("","Connected · "+roleLabel(ROLE));sbSubscribe();sbWireLive();})
      .catch(function(err){_done=true;clearTimeout(_to);var msg=(err&&(err.message||err.hint))||JSON.stringify(err);console.error("SMOU DB error:",err);renderApp();setSave("err","DB error");toast("DB error: "+msg,"err");});
  }).catch(function(err){showLogin("Couldn't load your profile: "+((err&&err.message)||err));});
}
function showLogin(errMsg){
  setSave("","Sign in required");
  var ex=document.getElementById("authgate");if(ex)ex.remove();
  var g=document.createElement("div");g.className="authgate";g.id="authgate";
  g.innerHTML='<div class="authcard"><div class="authbrand"><span class="lg">◈</span><div class="ab-t"><b>SMOU</b><small>Fleet · Kuwait</small></div></div>'+
    '<h2>Sign in</h2>'+
    (errMsg?'<div class="autherr">'+esc(errMsg)+'</div>':'')+
    '<div class="authfield"><label>Email</label><input id="authEmail" type="email" autocomplete="username" placeholder="you@company.com"></div>'+
    '<div class="authfield"><label>Password</label><input id="authPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
    '<button class="btn primary authbtn" id="authBtn">Sign in</button>'+
    '</div>';
  document.body.appendChild(g);
  var run=function(){doLogin();};
  g.querySelector("#authBtn").addEventListener("click",run);
  g.querySelector("#authPass").addEventListener("keydown",function(e){if(e.key==="Enter")run();});
  g.querySelector("#authEmail").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();g.querySelector("#authPass").focus();}});
  setTimeout(function(){var i=g.querySelector("#authEmail");if(i)i.focus();},60);
}
function hideLogin(){var el=document.getElementById("authgate");if(el)el.remove();}
function doLogin(){
  var em=((document.getElementById("authEmail")||{}).value||"").trim();
  var pw=(document.getElementById("authPass")||{}).value||"";
  if(!em||!pw){showLogin("Enter email and password.");return;}
  var btn=document.getElementById("authBtn");if(btn){btn.disabled=true;btn.textContent="Signing in…";}
  SB.auth.signInWithPassword({email:em,password:pw}).then(function(res){
    if(res.error){showLogin(res.error.message||"Wrong email or password.");return;}
    onAuthed(res.data.user);
  }).catch(function(e){showLogin("Sign in failed — check your internet.");});
}
function doLogout(){if(SB&&SB.auth){SB.auth.signOut().then(function(){location.reload();}).catch(function(){location.reload();});}}

var NOTES=[],_notesLoaded=false,_notesRemote=false;
function noteKey(){return "smou-notes-"+((USER&&USER.id)||"local");}
function loadNotesLocal(){try{NOTES=JSON.parse(localStorage.getItem(noteKey())||"[]")||[];}catch(e){NOTES=[];}if(!Array.isArray(NOTES))NOTES=[];}
function saveNotesLocal(){try{localStorage.setItem(noteKey(),JSON.stringify(NOTES));}catch(e){}}
function saveNotes(){saveNotesLocal();if(SB_ON&&USER&&SB){try{SB.from("records").upsert({collection:"usernotes",id:USER.id,data:{notes:NOTES}},{onConflict:"collection,id"}).then(function(){}).catch(function(){});}catch(e){}}}
function loadNotesRemote(){
  if(!SB_ON||!USER||!SB||_notesRemote)return;_notesRemote=true;
  try{SB.from("records").select("data").eq("collection","usernotes").eq("id",USER.id).then(function(res){
    if(res&&!res.error&&res.data&&res.data.length){
      var rn=(res.data[0].data&&res.data[0].data.notes)||[];
      var map={};NOTES.forEach(function(n){map[n.id]=n;});rn.forEach(function(n){if(!map[n.id]||(n.ts||0)>(map[n.id].ts||0))map[n.id]=n;});

function aiAsk(q){
  q=(q||"").trim();if(!q||AIBUSY)return;

  fetch(url.replace(/\/$/,"")+"/functions/v1/ai-assistant",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key,"apikey":key},body:JSON.stringify({question:q,context:aiContext()})})
    .then(function(r){return r.json().catch(function(){return {};});})
    .then(function(j){AIBUSY=false;AICHAT.push({role:"ai",text:(j&&(j.answer||j.text||j.error))||"Sorry, I couldn't get an answer."});renderAIChat();})
    .catch(function(){AIBUSY=false;AICHAT.push({role:"ai",text:"Couldn't reach the AI service. Make sure the ‘ai-assistant’ function is deployed and GEMINI_API_KEY is set in Supabase."});renderAIChat();});

  ids.forEach(function(id){var i=arr.findIndex(function(r){return r.id===id;});if(i>=0){logAudit("delete",ent,id,recLabel(ent,arr[i]),[]);arr.splice(i,1);n++;}});
  view.sel={};closeForm();renderApp();persist();toast("Deleted "+n+" "+ENT[ent].title.toLowerCase()+".","good");

function distinct(rows,k){var m={};rows.forEach(function(r){if(r[k])m[r[k]]=1;});return Object.keys(m).sort();}

var EXPRPT={preset:"this",from:"",to:"",groupby:"Expense Type",type:"",sub:"",payment:"",platform:"",employee:"",plate:""};
function _iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function expPresetRange(p){var n=TODAY,y=n.getFullYear(),m=n.getMonth();
  if(p==="this")return [_iso(new Date(y,m,1)),_iso(n)];
  if(p==="last")return [_iso(new Date(y,m-1,1)),_iso(new Date(y,m,0))];
  if(p==="q")return [_iso(new Date(y,m-2,1)),_iso(n)];
  if(p==="year")return [_iso(new Date(y,0,1)),_iso(n)];
  return ["",""];}
function expSubsForType(type){
  var sc=STATE.lookups.subcategories||{};var out=[];
  if(type&&sc[type]){out=sc[type].slice();}
  else{Object.keys(sc).forEach(function(k){(sc[k]||[]).forEach(function(s){if(out.indexOf(s)<0)out.push(s);});});}
  distinct((STATE.finance.expenses||[]).filter(function(r){return !type||r.category===type;}),"sub").forEach(function(s){if(out.indexOf(s)<0)out.push(s);});
  return out;
}

function readExpReportForm(){
  var ov=$("#overlay");if(!ov)return;
  EXPRPT.preset=($("#rpPreset",ov)||{}).value||"this";
  EXPRPT.groupby=($("#rpGroup",ov)||{}).value||"Expense Type";
  if(EXPRPT.preset==="custom"){EXPRPT.from=($("#rpFrom",ov)||{}).value||"";EXPRPT.to=($("#rpTo",ov)||{}).value||"";}
  else{var r=expPresetRange(EXPRPT.preset);EXPRPT.from=r[0];EXPRPT.to=r[1];}
  EXPRPT.type=($("#rpType",ov)||{}).value||"";
  EXPRPT.sub=($("#rpSub",ov)||{}).value||"";
  EXPRPT.payment=($("#rpPay",ov)||{}).value||"";
  EXPRPT.platform=($("#rpPlat",ov)||{}).value||"";
  EXPRPT.employee=(($("#rpEmp",ov)||{}).value||"").trim();
  EXPRPT.plate=(($("#rpPlate",ov)||{}).value||"").trim();
}
function filteredExpenses(){
  var f=EXPRPT;var emp=f.employee.toLowerCase(),pl=f.plate.toLowerCase();
  return (STATE.finance.expenses||[]).filter(function(r){
    if(f.from||f.to){var d=parseD(r.date);if(!d)return false;var iso=_iso(d);if(f.from&&iso<f.from)return false;if(f.to&&iso>f.to)return false;}
    if(f.type&&r.category!==f.type)return false;
    if(f.sub&&r.sub!==f.sub)return false;
    if(f.payment&&r.payment!==f.payment)return false;
    if(f.platform&&r.platform!==f.platform)return false;
    if(emp&&String(r.driver||"").toLowerCase().indexOf(emp)<0)return false;
    if(pl&&String(r.plate||"").toLowerCase().indexOf(pl)<0)return false;
    return true;
  }).sort(function(a,b){var da=parseD(a.date),db=parseD(b.date);return (db?db.getTime():0)-(da?da.getTime():0);});
}
function runExpReport(){readExpReportForm();closeForm();renderExpReport();}
function expGroupKey(r){switch(EXPRPT.groupby){
  case "Sub-Category":return r.sub||"—";
  case "Payment Method":return r.payment||"—";
  case "Employee / Rider":return r.driver||"—";
  case "Platform":return r.platform||"—";
  case "None":return null;
  default:return r.category||"—";}}
function renderExpReport(){
  var rows=filteredExpenses();
  var total=rows.reduce(function(a,r){return a+(num(r.amount)||0);},0);
  var cnt=rows.length;var avg=cnt?total/cnt:0;
  var f=EXPRPT;
  var period=(f.from||f.to)?((f.from?fmtD(f.from):"start")+"  →  "+(f.to?fmtD(f.to):"today")):"All time";
  // active filter chips
  var chips=[];
  chips.push('<span class="rp-chip">📅 '+esc(period)+'</span>');
  if(f.type)chips.push('<span class="rp-chip">'+esc(f.type)+'</span>');
  if(f.sub)chips.push('<span class="rp-chip">'+esc(f.sub)+'</span>');
  if(f.payment)chips.push('<span class="rp-chip">'+esc(f.payment)+'</span>');
  if(f.platform)chips.push('<span class="rp-chip">'+esc(f.platform)+'</span>');
  if(f.employee)chips.push('<span class="rp-chip">👤 '+esc(f.employee)+'</span>');
  if(f.plate)chips.push('<span class="rp-chip">🚗 '+esc(f.plate)+'</span>');
  // breakdown
  var bd="";
  if(f.groupby!=="None"){
    var g={};rows.forEach(function(r){var k=expGroupKey(r);if(k==null)return;if(!g[k])g[k]={amt:0,n:0};g[k].amt+=(num(r.amount)||0);g[k].n++;});
    var keys=Object.keys(g).sort(function(a,b){return g[b].amt-g[a].amt;});
    var mx=keys.length?g[keys[0]].amt:0;
    bd='<div class="card" style="margin-top:14px"><div class="card-h"><h3>By '+esc(f.groupby)+'</h3><span class="hint">'+keys.length+' groups</span></div><div class="card-b">'+
      (keys.length?keys.map(function(k){var w=mx>0?Math.max(4,Math.round(g[k].amt/mx*100)):0;var pct=total>0?Math.round(g[k].amt/total*100):0;
        return '<div class="rp-brow"><div class="rp-bmain"><div class="rp-bk">'+esc(k)+' <span class="rp-bn">'+g[k].n+'</span></div><div class="rp-bbar"><span style="width:'+w+'%"></span></div></div><div class="rp-bamt"><b>'+money(g[k].amt)+'</b><span>'+pct+'%</span></div></div>';
      }).join(""):'<div class="empty" style="padding:16px">No data.</div>')+
    '</div></div>';
  }
  // detail table
  var det='<div class="card" style="margin-top:14px"><div class="card-h"><h3>Transactions</h3><span class="hint">'+cnt+' entries</span></div><div class="tbl-wrap" style="max-height:44vh;overflow:auto"><table class="dt"><thead><tr><th>Date</th><th>Expense Type</th><th>Sub-Category</th><th>Amount (KWD)</th><th>Payment</th><th>Employee</th><th>Notes</th></tr></thead><tbody>'+
    (rows.length?rows.map(function(r){return '<tr><td class="mono">'+fmtD(r.date)+'</td><td>'+esc(r.category||"—")+'</td><td>'+esc(r.sub||"—")+'</td><td class="mono nm" style="color:var(--amber-2)">'+money(num(r.amount))+'</td><td>'+esc(r.payment||"—")+'</td><td>'+esc(r.driver||"—")+'</td><td style="max-width:280px;white-space:normal;font-size:12px;color:var(--muted)">'+esc(r.notes||"")+'</td></tr>';}).join(""):'<tr><td colspan="7"><div class="empty" style="padding:24px"><h4>No matching expenses</h4><p>Try widening the date range or clearing filters.</p></div></td></tr>')+
    '</tbody></table></div></div>';
  var ov=document.createElement("div");ov.className="overlay";ov.id="overlay";
  ov.innerHTML='<div class="modal" style="max-width:960px;max-height:94vh;overflow:auto">'+
    '<div class="modal-h"><div><h3>Expense Report</h3><div class="rp-chips">'+chips.join("")+'</div></div><button class="icon-btn" data-act="close">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div>'+
    '<div class="modal-b">'+
      '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">'+
        '<div class="stat card"><span class="strip" style="background:var(--amber)"></span><div class="s-lab">Total Spend</div><div class="s-val">'+money(total)+' KD</div><div class="s-sub">in this report</div></div>'+
        '<div class="stat card"><span class="strip" style="background:var(--teal)"></span><div class="s-lab">Entries</div><div class="s-val">'+cnt+'</div><div class="s-sub">matching filters</div></div>'+
        '<div class="stat card"><span class="strip" style="background:var(--indigo)"></span><div class="s-lab">Avg / Entry</div><div class="s-val">'+money(avg)+'</div><div class="s-sub">KWD</div></div>'+
      '</div>'+bd+det+
    '</div>'+
    '<div class="modal-f"><button class="btn ghost" data-act="rptedit">'+svg('<path d="M4 21h4l11-11-4-4L4 17z"/>')+'Edit filters</button><span style="flex:1"></span>'+
      '<button class="btn" data-act="rptexport">'+svg('<path d="M12 3v11M8 10l4 4 4-4"/><path d="M4 21h16"/>')+'Export (Excel)</button>'+
      '<button class="btn primary" data-act="close">Done</button></div>'+
  '</div>';
  document.body.appendChild(ov);
}
function exportExpReport(){
  var rows=filteredExpenses();
  if(!rows.length){toast("No rows to export.","err");return;}
  if(typeof saveSheet==="function"){saveSheet("expenses",true,rows);toast("Exported "+rows.length+" rows.","good");}
}

function fillRows(ent){
  var cfg=ENT[ent],rows=store(ent).slice();
  if(view.search&&view.search.trim()){var toks=view.search.toLowerCase().split(/\s+/).filter(Boolean);
    rows=rows.filter(function(r){var hay=Object.keys(r).map(function(k){return (k==="docs"||k==="photo"||k==="receipt")?"":String(r[k]||"");}).join("  ").toLowerCase();return toks.every(function(t){return hay.indexOf(t)>=0;});});}
  rows=msApply(rows,view.filters);
  if(view.sort!=null){var c=cfg.columns[view.sort];rows.sort(function(a,b){var av=c.s(a),bv=c.s(b);if(typeof av==="number"&&typeof bv==="number")return (av-bv)*view.dir;var as=String(av==null?"":av).trim(),bs=String(bv==null?"":bv).trim();if(!as&&bs)return 1;if(as&&!bs)return -1;return as.localeCompare(bs)*view.dir;});}
  view._visIds=rows.map(function(r){return r.id;});
  if(!view.sel)view.sel={};
  var tb=$("#tbody");
  if(!rows.length){tb.innerHTML='<tr><td colspan="'+(cfg.columns.length+2)+'"><div class="empty">'+svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>')+'<h4>No records</h4><p>'+(view.search||Object.values(view.filters).some(Boolean)?"Nothing matches your filters.":"Add your first "+cfg.singular.toLowerCase()+".")+'</p></div></td></tr>';}
  else tb.innerHTML=rows.map(function(r){var on=!!view.sel[r.id];
    return '<tr data-rowid="'+r.id+'" class="'+(on?"selrow":"")+'" style="cursor:pointer"><td class="selcol"><input type="checkbox" class="selchk" data-selrow data-id="'+r.id+'"'+(on?" checked":"")+'></td>'+cfg.columns.map(function(c){return '<td>'+c.v(r)+'</td>';}).join("")+
    '<td class="actcol"><button class="rowmenu-btn" data-rowmenu data-id="'+r.id+'" title="Actions">'+svg('<circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/>')+'</button></td></tr>';}).join("");
  refreshSelUI(ent);
  var f=$("#foot");if(f){var ft="Showing "+rows.length+" of "+store(ent).length+" "+cfg.title.toLowerCase();
    if(ent==="expenses"){var tot=rows.reduce(function(a,b){return a+(num(b.amount)||0);},0);ft+="  ·  Total "+money(tot)+" KWD";}
    f.textContent=ft;}
  var th=$("#thead");if(th)$$("th",th).forEach(function(t,i){t.classList.toggle("sorted",view.sort===i);var ar=t.querySelector(".sar");if(ar&&i<cfg.columns.length)ar.textContent=view.sort===i?(view.dir>0?"▲":"▼"):"⇅";});
}

function secIcon(name){
  var n=(name||"").toLowerCase();
  if(/ident|person|driver|basic|profile|candidate|applicant/.test(n))return '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 4-6.5 8-6.5s8 2 8 6.5"/>';
  if(/contact|phone|bank|address|reach/.test(n))return '<path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 2 6a2 2 0 0 1 2-2z"/>';
  if(/employ|role|job|work|assign|status|shift/.test(n))return '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>';
  if(/doc|expiry|expir|licen|passport|legal|permit/.test(n))return '<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4M9 13h6M9 17h6"/>';
  if(/vehicle|car|bike|plate|fleet|fuel|sim/.test(n))return '<path d="M4 13l1.6-4.5A2.5 2.5 0 0 1 8 7h8a2.5 2.5 0 0 1 2.4 1.5L20 13"/><path d="M3 17h18"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>';
  if(/pay|salary|amount|cost|finance|money|expense|income|budget/.test(n))return '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.2 9.4h4a1.6 1.6 0 0 1 0 3.2h-2a1.6 1.6 0 0 0 0 3.2h4"/>';
  if(/hous|room|accommodat|bed/.test(n))return '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>';
  return '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>';
}
function pvPrimary(ent,rec){return (rec.name||rec.nameEn||rec.plate||rec.room||rec.card||rec.mobile||rec.category||ENT[ent].singular);}
function pvAva(ent,rec,primary,mode,id){
  var initial=((primary||"?").trim().charAt(0)||"?").toUpperCase();
  if(ent==="drivers"||ent==="hiring"){
    if(mode==="detail"&&ent==="drivers"){
      var cam='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3.5"/></svg>';
      return '<div class="detail-ava photo" data-act="photopick" data-id="'+id+'" title="Upload / change photo">'+
        (rec.photo?'<span class="ava-clip"><img src="'+esc(rec.photo)+'" alt=""></span>':esc(initial))+
        '<span class="cam">'+cam+'</span>'+
        (rec.photo?'<button class="ava-del" data-act="photodel" data-id="'+id+'" title="Remove photo">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button>':'')+'</div>';
    }
    return '<div class="pvc-ava">'+(rec.photo?'<span class="ava-clip"><img src="'+esc(rec.photo)+'" alt=""></span>':esc(initial))+'</div>';
  }
  // linked employee photo — if this record names an employee who has a photo, show it here too
  var linkName=rec.driver||rec.employee||((ent==="fuel"||ent==="sims")?rec.name:"");
  if(linkName){var lp=empPhotoByName(linkName);if(lp)return '<div class="'+(mode==="detail"?"detail-ava":"pvc-ava")+'"><span class="ava-clip"><img src="'+esc(lp)+'" alt=""></span></div>';}
  var vt=(rec.veh||rec.vehType||"")+"";
  if(/bike|motor|scoot/i.test(vt))return '<div class="pvc-ava">'+vIcon("bike")+'</div>';
  if(/car|sedan|van|vehicle/i.test(vt)||ent==="vehicles"||ent==="fuel")return '<div class="pvc-ava">'+vIcon("car")+'</div>';
  return '<div class="pvc-ava">'+esc(initial)+'</div>';
}
function pvChips(ent,rec){
  var out=[];
  if(rec.status)out.push(pill(cap(rec.status),statusClass(rec.status)));
  if(ent==="drivers"&&isOnVacation(rec.name))out.push('<span class="pill vac-pill">On Vacation</span>');
  ["veh","vehType","platform","company","brand","site","payment"].forEach(function(k){if(rec[k]&&out.length<4)out.push('<span class="pvc-chip">'+esc(rec[k])+'</span>');});
  return out.join("");
}
function pvMeta(ent,cfg,rec,primary){
  var rows=[],seen=0;
  cfg.fields.forEach(function(f){
    if(f.g||seen>=3||f.t==="textarea")return;
    if(/^(photo|docs|receipt|notes|name|nameEn|doc)$/.test(f.k)||f.t==="file")return;
    var v=rec[f.k];if(v==null||String(v).trim()==="")return;
    if(String(v).trim()===String(primary==null?"":primary).trim())return;
    rows.push('<div><span>'+esc(f.l)+'</span><b>'+detailVal(ent,f,rec)+'</b></div>');seen++;
  });
  return rows.length?'<div class="pvc-meta">'+rows.join("")+'</div>':"";
}
function pvComplete(cfg,rec){
  var tot=0,fill=0;cfg.fields.forEach(function(f){if(f.g)return;tot++;var v=rec[f.k];if(v!=null&&String(v).trim()!=="")fill++;});
  return tot?Math.round(fill/tot*100):0;
}

    '<div class="pvc-sub">'+(sub?esc(sub):"&nbsp;")+'</div>'+

    '<div class="pvc-rl">'+(mode==="detail"?"Profile filled":"Completeness")+'</div>'+
    pvMeta(ent,cfg,rec,primary);

function openForm(ent,id){
  if(READONLY){toast("You have view-only access.","err");return;}
  var cfg=ENT[ent];var rec=id?store(ent).filter(function(r){return r.id===id;})[0]:null;
  var editing=!!rec;var data=rec?clone(rec):{};
  if(ent==="expenses"&&!editing){data.date=isoToday();data.month=MON[TODAY.getMonth()];}
  // group fields by the f.g separators, into section cards
  var groups=[],cur=null;

// Read + upload any t:"file" fields in the form. Resolves a map {fieldKey: docObj | null(remove) | undefined(unchanged)}.
function processFormFiles(ent,cfg,ov){
  var jobs=[];var result={};
  cfg.fields.forEach(function(f){
    if(f.t!=="file")return;
    var input=$('[name="_file_'+f.k+'"]',ov);
    var fld=input?input.closest(".field"):null;
    var file=input&&input.files&&input.files[0];
    if(file){
      jobs.push(prepDoc({},file,f.l).then(function(doc){
        var nameEl=$('[name="'+f.k+'Name"]',ov)||$('[name="docName"]',ov);
        var obj={name:((nameEl&&nameEl.value)||"").trim()||doc.name,mime:doc.mime};
        if(SB_ON){return sbUpload(ent+"/"+uid("att")+"."+extFor(doc.mime),dataURLtoBlob(doc.data),doc.mime).then(function(url){obj.url=url;result[f.k]=obj;}).catch(function(){obj.data=doc.data;result[f.k]=obj;});}
        obj.data=doc.data;result[f.k]=obj;
      }).catch(function(){}));
    } else if(fld&&fld.getAttribute("data-fremoved")==="1"){
      result[f.k]=null;
    }
  });
  return Promise.all(jobs).then(function(){return result;});
}

  else{if(file.size>4.5*1024*1024){toast("Receipt too large (max ~4 MB).","err");return;}reader.onload=function(){cb(reader.result);};reader.readAsDataURL(file);}

    var hi=-1,H=null;
    for(var r=0;r<Math.min(6,aoa.length);r++){var ru=(aoa[r]||[]).map(function(x){return String(x).toUpperCase().trim();});var j=ru.join("|");if(/PLATFORM/.test(j)&&/ORDER/.test(j)&&/DRIVER|NAME|RIDER/.test(j)){hi=r;H=ru;break;}}

      var name=normDriver(String((ci.driver>=0?row[ci.driver]:"")||"").trim());if(!name)continue;

      var mon=shortMon(ci.month>=0?row[ci.month]:"");

function saveDailyEntry(){
  if(!can("edit")){toast("You have view-only access.","err");return;}
  var g=function(id){return (document.getElementById(id)||{}).value;};
  var date=(g("dlDate")||"").trim(),driver=normDriver((g("dlDriver")||"").trim()),plat=(g("dlPlat")||"").trim(),veh=(g("dlVeh")||"").trim(),orders=num(g("dlOrders")),note=(g("dlNote")||"").trim();
  if(!date){toast("Pick a date.","err");return;}
  if(!driver){toast("Enter a driver name.","err");return;}
  if(orders==null){toast("Enter the number of orders.","err");return;}
  if(!STATE.grd.orderlog)STATE.grd.orderlog=[];
  var wasEdit=!!dailyEdit;
  if(dailyEdit){var r=STATE.grd.orderlog.filter(function(x){return x.id===dailyEdit;})[0];if(r){r.date=date;r.driver=driver;r.platform=plat;r.vehicle=veh;r.orders=orders;r.note=note;}dailyEdit=null;}
  else STATE.grd.orderlog.unshift({id:uid("dl"),date:date,driver:driver,platform:plat,vehicle:veh,orders:orders,note:note});
  persist();pageOrders($("#page"));toast(wasEdit?"Entry updated.":"Entry added.","good");
  if(!wasEdit){var di=document.getElementById("dlDriver");if(di){di.focus();}}
}
function delDailyEntry(id){
  if(!can("delete")){toast("Only an admin can delete entries.","err");return;}
  STATE.grd.orderlog=(STATE.grd.orderlog||[]).filter(function(x){return x.id!==id;});
  if(dailyEdit===id)dailyEdit=null;
  persist();pageOrders($("#page"));toast("Entry deleted.","good");
}

function isPettyPay(e){return !/company\s*a\/?c|company\s*account/i.test(e.payment||"");} // Company A/C paid = not from petty cash

function stdev(a,m){if(a.length<2)return 0;var v=a.reduce(function(x,y){return x+(y-m)*(y-m);},0)/a.length;return Math.sqrt(v);}

function computeInsights(ex){

  var seen={};ex.forEach(function(e){if(eAmt(e)<=0)return;var k=(e.plate||"?")+"|"+(e.category||"?")+"|"+(e.date||"?")+"|"+eAmt(e).toFixed(3);(seen[k]=seen[k]||[]).push(e);});

  var tm=mKeyOf(TODAY),lm=mKeyOf(new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1));

  var rank={danger:0,warn:1,info:2};out.sort(function(a,b){return rank[a.sev]-rank[b.sev];});

function pageFinance(pg){
  var all=STATE.finance.expenses;
  var ex=all.filter(function(e){return inPeriod(e,finPeriod);});
  var total=ex.reduce(function(a,b){return a+eAmt(b);},0);
  var tm=mKeyOf(TODAY),lm=mKeyOf(new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1));
  var thisT=all.filter(function(e){return mKey(e)===tm;}).reduce(function(a,b){return a+eAmt(b);},0);
  var lastT=all.filter(function(e){return mKey(e)===lm;}).reduce(function(a,b){return a+eAmt(b);},0);
  var mom=lastT>0?Math.round((thisT-lastT)/lastT*100):null;
  var catItems=groupSum(ex,function(e){return e.category||"Other";});
  var vehItems=groupSum(ex,function(e){return (e.plate||"").trim();}).slice(0,8);
  var drvItems=groupSum(ex,function(e){return (e.driver||"").trim();}).slice(0,8);
  var insights=computeInsights(all);
  // ---- P&L: income, payroll, profit ----
  var incAll=STATE.finance.income||[];
  var incP=incAll.filter(function(e){return inPeriod(e,finPeriod);});
  var incomeTotal=incP.reduce(function(a,b){return a+(num(b.amount)||0);},0);
  var payrollTotal=(STATE.finance.payroll||[]).filter(function(pr){return inPeriodMK(payMK(pr),finPeriod);}).reduce(function(a,b){return a+netPay(b);},0);
  var companyExp=ex.filter(function(e){return !isRecov(e);}).reduce(function(a,b){return a+eAmt(b);},0);
  var recovExp=total-companyExp; // money spent that will come back from drivers (receivable, not a real cost)
  var fixedTotal=ex.filter(isFixed).reduce(function(a,b){return a+eAmt(b);},0);
  var varTotal=companyExp-fixedTotal; // variable company cost (exclude recoverables)

/* ============ PAYROLL (auto-computed) ============ */
var PAYROLL_STATUSES=["ACTIVE","OFFICE"];
var payMK_sel="";
function payEmployees(){
  return (STATE.grd.drivers||[]).filter(function(d){
    return d.name && PAYROLL_STATUSES.indexOf((d.status||"").trim().toUpperCase())>=0;
  });
}
var PAYROLL_START_MK="2026-09"; // fleet payroll begins Sep 2026 — no months before this
function payMonthList(){ // Sep 2026 forward, up to current month (chronological)
  var out=[],sp=PAYROLL_START_MK.split("-"),d=new Date(+sp[0],+sp[1]-1,1),end=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  while(d<=end){out.push(mKeyOf(d));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  if(!out.length)out.push(PAYROLL_START_MK);
  return out;
}
function payClampMonth(){var l=payMonthList();if(l.indexOf(payMK_sel)<0)payMK_sel=l[l.length-1];}
// which payroll month a salary/wage expense counts in (explicit For-Month wins, else the date)
function wageMK(e){
  if(e.wmonth){var mi=MON.indexOf(e.wmonth);if(mi>=0){var d=parseD(e.date);var y=num(e.wyear)||(d?d.getFullYear():TODAY.getFullYear());return y+"-"+String(mi+1).padStart(2,"0");}}
  return mKey(e);
}
function mkIndex(mk){var p=(mk||"").split("-");return (+p[0])*12+((+p[1])-1);}
// installment share of a recoverable item for a given payroll month (start = entry month)
function recovPart(r,amtKey,mk){
  var total=num(r[amtKey])||0;if(total<=0)return null;
  var start=mKey(r);if(!start)return null;
  var n=Math.max(1,Math.round(num(r.installments)||1));
  if(!mk)return {amount:total,inst:(n>1?"1/"+n:"")};
  var idx=mkIndex(mk)-mkIndex(start);
  if(idx<0||idx>=n)return null;                 // this month is outside the installment window
  var per=Math.round(total/n*1000)/1000;
  var amt=(idx===n-1)?Math.round((total-per*(n-1))*1000)/1000:per;  // last one absorbs rounding
  return {amount:amt,inst:(n>1?(idx+1)+"/"+n:"")};
}
// full payslip for one employee in a month-key
function payslipFor(d,mk){
  var name=(d.name||"").trim();
  var basic=num(d.salary)||0;
  var sal=[],adv=[],inc=[],food=[];
  (STATE.finance.expenses||[]).forEach(function(e){
    if((e.driver||"").trim()!==name)return;
    if(!/salar|wage/i.test(e.category||""))return;            // only Salaries & Wages
    if(mk&&wageMK(e)!==mk)return;
    var sub=(e.sub||""),amt=eAmt(e);if(amt<=0)return;
    if(/advance/i.test(sub))adv.push({label:"Advance Payment",amount:amt,date:e.date});
    else if(/incentive/i.test(sub))inc.push({label:"Incentive",amount:amt,date:e.date});
    else if(/food/i.test(sub))food.push({label:"Food Allowance",amount:amt,date:e.date});
    else sal.push({label:(sub||"Salary"),amount:amt,date:e.date});   // base Salary
  });
  // recoverable-unrecovered deductions: fleet-ops + non-salary expenses (with installments)
  var recov=[];
  function addR(list,amtKey,src){(list||[]).forEach(function(r){
    if(!isRecov(r)||isRecovered(r))return;
    if((r.recoverFrom||"").trim()!==name)return;
    var p=recovPart(r,amtKey,mk);if(!p||p.amount<=0)return;
    recov.push({src:src,amount:p.amount,date:r.date,label:(r.reason||r.type||r.category||src),inst:p.inst});
  });}
  (STATE.finance.expenses||[]).forEach(function(e){
    if(/salar|wage/i.test(e.category||""))return;             // salary handled above
    if(!isRecov(e)||isRecovered(e))return;
    if((e.recoverFrom||"").trim()!==name)return;
    var p=recovPart(e,"amount",mk);if(!p||p.amount<=0)return;
    recov.push({src:"Expense",amount:p.amount,date:e.date,label:(e.category||"Expense"),inst:p.inst});
  });
  addR(STATE.grd.fines,"amount","Fine");
  addR(STATE.grd.incidents,"cost","Incident");
  addR(STATE.grd.maintenance,"cost","Maintenance");
  var salaryPaid=sal.reduce(function(a,x){return a+x.amount;},0);
  var incentive=inc.reduce(function(a,x){return a+x.amount;},0);
  var foodT=food.reduce(function(a,x){return a+x.amount;},0);
  var advance=adv.reduce(function(a,x){return a+x.amount;},0);
  var recovT=recov.reduce(function(a,x){return a+x.amount;},0);
  var additions=incentive+foodT, deductions=advance+recovT, gross=basic+additions;
  return {d:d,basic:basic,sal:sal,inc:inc,food:food,adv:adv,recov:recov,
    salaryPaid:salaryPaid,incentive:incentive,foodT:foodT,advance:advance,recovT:recovT,
    additions:additions,deductions:deductions,gross:gross,net:gross-deductions,paid:salaryPaid>0};
}

function loadSampleExpenses(){
  var plates=STATE.grd.vehicles.map(function(v){return v.plate;}).filter(Boolean);
  if(plates.length<4)plates=["22-15047","22-15886","22-15242","33-10011","44-20022","55-30033"];
  plates=plates.slice(0,8);
  var drivers=STATE.grd.drivers.map(function(d){return d.name;}).filter(Boolean);
  var subs=STATE.lookups.subcategories,plats=L("platforms"),pays=L("payments");
  function rnd(n){return Math.floor(Math.random()*n);}function pick(a){return a.length?a[rnd(a.length)]:"";}
  var ex=[];
  function add(daysAgo,cat,amount,plate,drv){var d=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-daysAgo);var sub=(subs[cat]&&subs[cat].length)?pick(subs[cat]):"";
    ex.push({id:uid("e"),demo:true,date:iso(d),month:MON[d.getMonth()],category:cat,sub:sub,vehType:/bike/i.test(cat)?"Bike":"Car",plate:plate,driver:drv||pick(drivers),platform:pick(plats),payment:pick(pays),amount:String(amount),notes:"sample"});}
  for(var i=0;i<42;i++){var cat=pick(["Fuel","Fuel","Fuel","Vehicle/Bike Maintenance","Salaries & Wages","Government/Legal Fees","Communication","Insurance"]);
    var amt=cat==="Fuel"?(6+rnd(9)):cat==="Salaries & Wages"?(80+rnd(70)):cat==="Insurance"?(30+rnd(40)):(4+rnd(28));
    add(rnd(88),cat,amt.toFixed(3),pick(plates));}
  // deliberate anomalies
  add(4,"Vehicle/Bike Maintenance","465.000",plates[0]);
  add(3,"Fuel","62.000",plates[1]);add(3,"Fuel","62.000",plates[1]);
  add(2,"Government/Legal Fees","180.000",plates[0]);
  add(38,"Fuel","8.000",plates[1]);add(64,"Fuel","9.000",plates[1]);
  add(6,"Vehicle/Bike Maintenance","35.000",plates[0]);add(20,"Vehicle/Bike Maintenance","40.000",plates[0]);
  STATE.finance.expenses=ex.concat(STATE.finance.expenses);
  persist();renderApp();toast("Loaded "+ex.length+" sample expenses.","good");
}

// prepare one doc (read + resize images) → resolves to a doc object with dataURL
function prepDoc(d,file,type){
  return new Promise(function(resolve,reject){
    var MAX=4.5*1024*1024;var reader=new FileReader();
    if(/^image\//.test(file.type)){
      reader.onload=function(){var img=new Image();img.onload=function(){
        var mx=1500,sc=Math.min(1,mx/Math.max(img.width,img.height));
        var cw=Math.max(1,Math.round(img.width*sc)),ch=Math.max(1,Math.round(img.height*sc));
        var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
        var data;try{data=cv.toDataURL("image/jpeg",0.82);}catch(e){data=reader.result;}
        resolve({id:uid("doc"),type:type,name:file.name,mime:"image/jpeg",size:Math.round(data.length*0.73),data:data,at:new Date().toISOString()});
      };img.onerror=function(){resolve({id:uid("doc"),type:type,name:file.name,mime:file.type,size:file.size,data:reader.result,at:new Date().toISOString()});};img.src=reader.result;};
      reader.onerror=function(){reject();};reader.readAsDataURL(file);
    } else {
      if(file.size>MAX){toast("Skipped "+file.name+" — too large (max ~4 MB).","err");reject();return;}
      reader.onload=function(){resolve({id:uid("doc"),type:type,name:file.name,mime:file.type||"application/octet-stream",size:file.size,data:reader.result,at:new Date().toISOString()});};
      reader.onerror=function(){reject();};reader.readAsDataURL(file);
    }
  });
}
function showLoader(msg){hideLoader();var el=document.createElement("div");el.id="loadov";el.className="loadov";el.innerHTML='<div class="loadcard"><div class="loadlogo">'+LOGO_SVG+'</div><div class="loadtxt">'+esc(msg||"Loading…")+'</div><div class="loaddots"><span></span><span></span><span></span></div></div>';document.body.appendChild(el);}

// re-render the docs modal AND the detail page behind it, so uploads/deletes show instantly (no manual refresh)
function refreshDocHost(d){var dd=drById(d.id)||d;renderDocsModal(dd);if(curEnt==="drivers"&&getRoute().indexOf("grd/drivers/"+dd.id)===0){var pg=$("#page");if(pg)pageDetail(pg,"drivers",dd.id);}fillRowsIfDrivers();}
function saveDocsBatch(d,items){
  if(!items.length)return;
  showLoader("Uploading "+items.length+" document"+(items.length>1?"s":"")+"…");
  var out=[];var chain=Promise.resolve();
  items.forEach(function(it){chain=chain.then(function(){
    return prepDoc(d,it.file,it.type).then(function(doc){
      if(SB_ON&&/^data:/.test(doc.data||"")){return sbUpload("drivers/"+d.id+"/doc-"+doc.id+"."+extFor(doc.mime),dataURLtoBlob(doc.data),doc.mime).then(function(url){doc.data=url;out.push(doc);}).catch(function(){out.push(doc);});}
      out.push(doc);
    }).catch(function(){});
  });});
  chain.then(function(){
    var live=drById(d.id)||d; // always mutate the CURRENT state object (realtime echo may have replaced it)
    if(!live.docs)live.docs=[];
    for(var i=out.length-1;i>=0;i--)live.docs.unshift(out[i]);
    if(out.length)logAudit("edit","drivers",live.id,recLabel("drivers",live),[{f:"docs",l:"Documents",from:"",to:"added "+out.length+" file(s)"}]);
    persist();
    hideLoader();refreshDocHost(live);
    toast("Saved "+out.length+" document(s).","good");
  }).catch(function(){hideLoader();refreshDocHost(drById(d.id)||d);});
}

  var body=document.getElementById("docBody");if(!body)return;
  body.innerHTML='<div class="banner info" style="margin-bottom:16px">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+'<div>Which document is <b>'+esc(file.name)+'</b> <span class="mono" style="opacity:.7">('+fmtSize(file.size)+')</span>?</div></div>'+
    '<div class="field"><label>Document type <span class="req">*</span></label><select id="docType"><option value="">— select —</option>'+DOCTYPES.map(function(t){return '<option>'+t+'</option>';}).join("")+'</select></div>'+
    '<div class="field" id="docOtherWrap" hidden style="margin-top:12px"><label>Specify document name</label><input id="docOther" placeholder="e.g. Bank Letter"></div>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-act="docback">Cancel</button><button class="btn primary" id="docSaveBtn">'+svg('<path d="M20 6 9 17l-5-5"/>')+'Save document</button></div>';

function saveDoc(d,file,type){
  var MAX=4.5*1024*1024;
  var reader=new FileReader();
  if(/^image\//.test(file.type)){
    reader.onload=function(){var img=new Image();img.onload=function(){
      var mx=1500,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var cw=Math.max(1,Math.round(img.width*sc)),ch=Math.max(1,Math.round(img.height*sc));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
      var data;try{data=cv.toDataURL("image/jpeg",0.82);}catch(e){data=reader.result;}
      commitDoc(d,{id:uid("doc"),type:type,name:file.name,mime:"image/jpeg",size:Math.round(data.length*0.73),data:data,at:new Date().toISOString()});
    };img.onerror=function(){commitDoc(d,{id:uid("doc"),type:type,name:file.name,mime:file.type,size:file.size,data:reader.result,at:new Date().toISOString()});};img.src=reader.result;};
    reader.readAsDataURL(file);
  } else {
    if(file.size>MAX){toast("File too large (max ~4 MB). Please compress it.","err");return;}
    reader.onload=function(){commitDoc(d,{id:uid("doc"),type:type,name:file.name,mime:file.type||"application/octet-stream",size:file.size,data:reader.result,at:new Date().toISOString()});};
    reader.readAsDataURL(file);
  }
}
function extFor(mime){return /pdf/.test(mime)?"pdf":/png/.test(mime)?"png":/jpeg|jpg/.test(mime)?"jpg":"bin";}

  else fin();
}

  if(READONLY){toast("You have view-only access.","err");return;}

function savePhoto(id,file){
  var rec=drById(id);if(!rec)return;
  var reader=new FileReader();
  reader.onload=function(){var img=new Image();
    img.onload=function(){
      var mx=560,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var cw=Math.max(1,Math.round(img.width*sc)),ch=Math.max(1,Math.round(img.height*sc));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
      var data;try{data=cv.toDataURL("image/jpeg",0.85);}catch(e){data=reader.result;}
      if(SB_ON){toast("Uploading photo…","good");sbUpload("drivers/"+id+"/photo.jpg",dataURLtoBlob(data),"image/jpeg").then(function(url){rec.photo=url;persist();pageDetail($("#page"),curEnt,id);toast("Photo updated.","good");}).catch(function(e){toast("Photo upload failed.","err");});}
      else{rec.photo=data;persist();pageDetail($("#page"),curEnt,id);toast("Photo updated.","good");}
    };
    img.onerror=function(){toast("Couldn't read that image.","err");};img.src=reader.result;};
  reader.readAsDataURL(file);
}

var fuelTrackPeriod="month";
function ftInRange(d,s,e){return !!d&&(!s||d>=s)&&(!e||d<=e);}
function ftRange(k){
  var n=TODAY,y=n.getFullYear(),m=n.getMonth();
  if(k==="month")return {start:new Date(y,m,1),end:null,prevStart:new Date(y,m-1,1),prevEnd:new Date(y,m,0),label:MON[m]+" "+y};
  if(k==="last")return {start:new Date(y,m-1,1),end:new Date(y,m,0),prevStart:new Date(y,m-2,1),prevEnd:new Date(y,m-1,0),label:MON[(m+11)%12]+" "+(m===0?y-1:y)};
  if(k==="q")return {start:new Date(y,m-2,1),end:null,prevStart:new Date(y,m-5,1),prevEnd:new Date(y,m-2,0),label:"Last 3 months"};
  return {start:null,end:null,prevStart:null,prevEnd:null,label:"All time"};
}
function ftAgg(start,end){
  var km={},fuel={},lit={},cnt={};
  (STATE.grd.service||[]).forEach(function(s){var p=String(s.plate||"").trim();if(!p)return;(s.kmlog||[]).forEach(function(l){if(ftInRange(parseD(l.date),start,end))km[p]=(km[p]||0)+(num(l.km)||0);});});
  (STATE.grd.fuel||[]).forEach(function(c){(c.fills||[]).forEach(function(x){if((x.type||"Fill")!=="Fill")return;var p=String(x.plate||c.plate||"").trim();if(!p)return;if(ftInRange(parseD(x.date),start,end)){fuel[p]=(fuel[p]||0)+(num(x.amount)||0);lit[p]=(lit[p]||0)+(num(x.liters)||0);cnt[p]=(cnt[p]||0)+1;}});});
  return {km:km,fuel:fuel,lit:lit,cnt:cnt};
}
function pageFuelTracker(pg){
  var R=ftRange(fuelTrackPeriod);var A=ftAgg(R.start,R.end);var P=ftAgg(R.prevStart,R.prevEnd);

    var v=vehByPlate(p);

  });

  var pKm=0,pFuel=0;Object.keys(P.km).forEach(function(p){pKm+=P.km[p];});Object.keys(P.fuel).forEach(function(p){pFuel+=P.fuel[p];});

  var delta=(fleetCpk!=null&&prevCpk!=null&&prevCpk>0)?((fleetCpk-prevCpk)/prevCpk*100):null;
  // rankable = both km & fuel present; else data gap
  var rankable=rows.filter(function(r){return r.cpk!=null;}).sort(function(a,b){return b.cpk-a.cpk;});
  var noKm=rows.filter(function(r){return r.fuel>0&&r.km<=0;});
  var noFuel=rows.filter(function(r){return r.km>0&&r.fuel<=0;});
  var maxCpk=rankable.length?rankable[0].cpk:0;
  var top=rankable[0];
  // period tabs
  var tabs='<div class="sub-tabs" style="margin-bottom:16px">'+[["month","This month"],["last","Last month"],["q","Last 3 months"],["all","All time"]].map(function(t){return '<button class="sub-tab'+(fuelTrackPeriod===t[0]?" active":"")+'" data-act="ftperiod" data-p="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';
  // KPI cards
  function kpi(lab,val,sub,col){return '<div class="stat card"><span class="strip" style="background:'+(col||"var(--teal)")+'"></span><div class="s-lab">'+lab+'</div><div class="s-val">'+val+'</div><div class="s-sub">'+(sub||"&nbsp;")+'</div></div>';}
  var deltaTxt=delta==null?"vs last period: —":((delta>=0?"▲ ":"▼ ")+Math.abs(delta).toFixed(0)+"% vs last period");
  var deltaCol=delta==null?"var(--muted)":(delta>0?"var(--crit)":"var(--good)");
  var kpis='<div class="stat-grid" style="margin-bottom:16px">'+

    kpi("Fleet Cost / km",fleetCpk!=null?fleetCpk.toFixed(3)+" KWD":"—","<span style='color:"+deltaCol+"'>"+deltaTxt+"</span>","var(--indigo)")+
    kpi("Top Consumer",top?esc(top.plate):"—",top?top.cpk.toFixed(3)+" KWD/km":"need km + fuel","var(--crit)")+
  '</div>';
  // ranked list
  var list='<div class="card"><div class="card-h"><h3>Consumption by Vehicle</h3><span class="hint">worst first · cost per km</span></div><div class="card-b">'+
    (rankable.length?rankable.map(function(r,i){
      var w=maxCpk>0?Math.max(5,Math.round(r.cpk/maxCpk*100)):0;
      var col=i===0?"var(--crit)":i<3?"var(--amber)":"var(--teal)";
      return '<div class="ft-row"><span class="ft-rank">'+(i+1)+'</span>'+
        '<div class="ft-main"><div class="ft-plate">'+esc(r.plate)+(r.veh?' <span class="ft-veh">'+esc(r.veh)+'</span>':'')+(r.driver?' <span class="ft-veh">· '+esc(r.driver)+'</span>':'')+'</div>'+
        '<div class="ft-bar"><span style="width:'+w+'%;background:'+col+'"></span></div>'+
        '<div class="ft-sub">'+fmtKm(r.km)+' km · '+money(r.fuel)+' KWD'+(r.kpl!=null?' · '+r.kpl.toFixed(1)+' km/L':'')+'</div></div>'+
        '<div class="ft-cpk"><b style="color:'+col+'">'+r.cpk.toFixed(3)+'</b><span>KWD/km</span></div></div>';
    }).join(""):'<div class="empty" style="padding:26px">'+svg('<path d="M3 3v18h18M7 14l3-3 3 2 4-5"/>')+'<h4>Not enough data yet</h4><p>Add daily KM in Vehicle Service and daily fuel in Fuel Cards — a vehicle needs both (with a matching plate) to rank here.</p></div>')+
  '</div></div>';
  // data-gap alerts
  var gaps="";

      (noKm.length?'<div style="margin-bottom:8px"><b style="font-size:13px">Fuel logged but no KM ('+noKm.length+'):</b> <span style="color:var(--muted);font-size:12.5px">'+noKm.map(function(r){return esc(r.plate);}).join(", ")+'</span></div>':'')+
      (noFuel.length?'<div><b style="font-size:13px">KM logged but no fuel ('+noFuel.length+'):</b> <span style="color:var(--muted);font-size:12.5px">'+noFuel.map(function(r){return esc(r.plate);}).join(", ")+'</span></div>':'')+
    '</div></div>';
  }
  var help='<div class="banner info" style="margin-top:16px">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+'<div style="font-size:12.5px">Cost/km = fuel spent ÷ km driven for each vehicle (matched by plate). Lower is better. Log daily KM in <b>Vehicle Service</b> and daily fuel in <b>Fuel Cards</b> — the tracker updates automatically.</div></div>';
  pg.innerHTML=tabs+kpis+list+gaps;
  if(LANG==="ar")transEl(pg);

function regFields(ent){return ENT[ent].fields.filter(function(f){return !f.g;});}

function buildAOA(ent,withData,rows){

function saveSheet(ent,withData,rows){

        } else blobSave();
      });
    }).catch(blobSave);
  } else blobSave();

function importSheet(ent,arraybuffer){
  if(!can("edit")){toast("You don't have permission to import.","err");return;}
  if(!xlsxReady()){toast("Excel engine still loading — try again in a moment.","err");return;}
  var aoa;
  try{var wb=XLSX.read(new Uint8Array(arraybuffer),{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",blankrows:false});}
  catch(e){toast("Couldn't read that file. Use an Excel (.xlsx) or CSV file.","err");return;}
  if(!aoa||aoa.length<2){toast("No data rows found in the file.","err");return;}
  var fs=regFields(ent),cfg=ENT[ent];
  var header=aoa[0].map(function(h){return String(h==null?"":h).trim().toLowerCase();});
  var map=header.map(function(h){
    if(h==="reference id"||h==="ref id"||h==="reference"||h==="refid"||h==="id")return "__refid__";
    var f=fs.filter(function(x){return x.l.toLowerCase()===h||x.k.toLowerCase()===h;})[0];return f?f.k:null;});
  if(!map.some(function(x){return x&&x!=="__refid__";})){toast("Columns didn't match. Use the blank template's headings.","err");return;}
  var added=0,updated=0;
  for(var i=1;i<aoa.length;i++){var r=aoa[i],rec={},any=false,refid="";
    for(var j=0;j<r.length;j++){var k=map[j];if(!k)continue;var v=r[j]==null?"":(typeof r[j]==="number"?String(r[j]):String(r[j]).trim());
      if(k==="__refid__"){refid=v;continue;}rec[k]=v;if(v)any=true;}
    if(!any&&!refid)continue;
    if(refid){var ex=store(ent).filter(function(x){return x.id===refid;})[0];
      if(ex){if(!any)continue;var chg=diffRec(cfg,ex,rec);Object.assign(ex,rec);logAudit("edit",ent,ex.id,recLabel(ent,ex),chg);updated++;continue;}
      // reference id given but not found → create WITH that id so it stays stable for future imports
      if(!any)continue;rec.id=refid;store(ent).unshift(rec);logAudit("add",ent,rec.id,recLabel(ent,rec),[]);added++;continue;}
    rec.id=uid(cfg.idp);store(ent).unshift(rec);logAudit("add",ent,rec.id,recLabel(ent,rec),[]);added++;}
  if(!added&&!updated){toast("Nothing to import.","err");return;}
  persist();renderApp();
  toast("Import done — "+added+" new"+(updated?", "+updated+" updated":"")+" in "+ENT[ent].title+".","good");
}

/* ============================================================
   COMMAND CENTER — live data from the Sumou driver app
   (tables: drivers, shifts, shift_points, fuel_records, driver_sessions — admin-only via RLS)
   ============================================================ */
var CC={loaded:false,loading:false,err:"",drivers:[],shifts:[],fuel:[],chan:null,
  map:null,markers:{},trails:{},view:null,follow:null,
  f:{driver:"all",platform:"all",status:"all",search:""}};
var CC_KM_FLAG=400, CC_STALE=120000, CC_PLATFORMS=["Talabat","Keeta"];
function ccIsAdmin(){return SB_ON&&!!SB&&ROLE==="admin";}
function ccToday(){try{return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kuwait"});}catch(e){return isoToday();}}
function ccDay(offset){try{return new Date(Date.now()-offset*86400000).toLocaleDateString("en-CA",{timeZone:"Asia/Kuwait"});}catch(e){return isoToday();}}
function ccMs(s){return Date.parse(s.started_at||s.created_at)||0;}
function ccLiveMs(s){return s.live_at?Date.parse(s.live_at):null;}
function ccStale(s){var t=ccLiveMs(s);return !t||Date.now()-t>CC_STALE;}
function ccAgo(ms){if(!ms)return "no GPS yet";var sec=Math.max(0,Math.round((Date.now()-ms)/1000));if(sec<60)return sec+"s ago";var m=Math.floor(sec/60);if(m<60)return m+"m ago";var h=Math.floor(m/60);if(h<24)return h+"h "+(m%60)+"m ago";return Math.floor(h/24)+"d ago";}
function ccDrv(id){return CC.drivers.filter(function(d){return String(d.id)===String(id);})[0];}
function ccEmp(d){if(!d||!d.employee_id)return null;return (STATE.grd.drivers||[]).filter(function(e){return e.id===d.employee_id;})[0]||null;}
function ccActive(){return CC.shifts.filter(function(s){return s.status==="ACTIVE";});}
function ccDone(){return CC.shifts.filter(function(s){return s.status==="COMPLETED";});}
function ccActiveFor(id){return CC.shifts.filter(function(s){return String(s.driver_id)===String(id)&&s.status==="ACTIVE";})[0];}
function ccFlag(s){return s.status==="COMPLETED"&&((s.distance||0)<0||(s.distance||0)>CC_KM_FLAG);}
function ccKmDay(day){return ccDone().filter(function(s){return s.date===day;}).reduce(function(a,s){return a+(s.distance||0);},0);}
function ccPass(s){var f=CC.f,d=ccDrv(s.driver_id);
  if(f.driver!=="all"&&String(s.driver_id)!==f.driver)return false;
  if(f.platform!=="all"&&s.platform!==f.platform)return false;
  if(f.status!=="all"&&s.status!==f.status)return false;
  if(f.search){var q=f.search.toLowerCase();if((((d&&d.name)||"")+" "+((d&&d.plate)||"")+" "+(s.login_place||"")+" "+(s.logout_place||"")).toLowerCase().indexOf(q)<0)return false;}
  return true;}

/* ---------- data ---------- */
function ccLoad(force){
  if(!ccIsAdmin())return Promise.resolve();
  if(CC.loading||(CC.loaded&&!force))return Promise.resolve();
  CC.loading=true;
  return Promise.all([
    SB.from("drivers").select("*").order("created_at"),
    sbPaged(function(){return SB.from("shifts").select("*").order("created_at",{ascending:false}).order("id",{ascending:true});}),
    sbPaged(function(){return SB.from("fuel_records").select("*").order("created_at",{ascending:false}).order("id",{ascending:true});})
  ]).then(function(r){
    CC.loading=false;
    var e=r[0].error||r[1].error||r[2].error;
    if(e){CC.err=e.message||String(e);return;}
    CC.err="";CC.loaded=true;
    CC.drivers=r[0].data||[];CC.shifts=r[1].data||[];CC.fuel=r[2].data||[];
    ccSubscribe();
  }).catch(function(e){CC.loading=false;CC.err=(e&&e.message)||"Could not load driver data";});
}
function ccSubscribe(){
  if(CC.chan||!SB)return;
  try{
    CC.chan=SB.channel("erp-command-center");
    ["drivers","shifts","fuel_records","shift_points"].forEach(function(t){CC.chan.on("postgres_changes",{event:"*",schema:"public",table:t},ccOnRealtime);});
    CC.chan.subscribe();
  }catch(e){CC.chan=null;}
}
function ccApply(table,ev,nw,old){
  var arr={drivers:CC.drivers,shifts:CC.shifts,fuel_records:CC.fuel}[table];if(!arr)return;
  if(ev==="DELETE"){var id=old&&old.id;var i=arr.findIndex(function(x){return String(x.id)===String(id);});if(i>=0)arr.splice(i,1);return;}
  if(!nw)return;var j=arr.findIndex(function(x){return String(x.id)===String(nw.id);});
  if(j>=0)arr[j]=nw;else if(table==="drivers")arr.push(nw);else arr.unshift(nw);
}
var _ccT=null;
function ccOnRealtime(p){
  if(p.table==="shift_points"){if(p.eventType==="INSERT"&&p.new)ccTrailPoint(p.new.shift_id,p.new.lat,p.new.lng);return;}
  if(p.table==="shifts"&&p.eventType==="UPDATE"&&p.new){
    var prev=CC.shifts.filter(function(x){return String(x.id)===String(p.new.id);})[0];
    if(prev&&prev.status==="ACTIVE"&&p.new.status==="ACTIVE"){ccApply("shifts","UPDATE",p.new,p.old);ccMove(p.new.id);return;}
  }
  ccApply(p.table,p.eventType,p.new,p.old);
  clearTimeout(_ccT);_ccT=setTimeout(function(){
    var r=getRoute();
    if(r.indexOf("cc/")===0){if(!_rtBusy())renderPage();}
    else if(r==="overview"){var b=document.getElementById("ccBanner");if(b)b.outerHTML=ccBannerHTML();}
    var cnt=document.querySelector('[data-route="cc/live"] .cnt');if(cnt)cnt.textContent=ccActive().length;
  },450);
}

  var m=window.L.map(el,{scrollWheelZoom:true}).setView([29.32,47.98],11);CC.map=m;
  window.L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}).addTo(m);
  var b=[],td=ccToday();
  CC.shifts.filter(ccPass).filter(function(s){return s.date===td;}).forEach(function(s){var d=ccDrv(s.driver_id),n=esc((d&&d.name)||"Driver");
    if(s.login_lat!=null){window.L.marker([s.login_lat,s.login_lng],{icon:ccPin("in")}).addTo(m).bindPopup('<b>'+n+' · login</b><br>'+esc(s.login_place||"")+'<br>'+esc(s.login_time||""));b.push([s.login_lat,s.login_lng]);}
    if(s.logout_lat!=null){window.L.marker([s.logout_lat,s.logout_lng],{icon:ccPin("out")}).addTo(m).bindPopup('<b>'+n+' · logout</b><br>'+esc(s.logout_place||"")+'<br>'+esc(s.logout_time||""));b.push([s.logout_lat,s.logout_lng]);}
  });
  ccActive().filter(ccPass).forEach(function(s){ccAddMarker(s);var la=s.live_lat!=null?s.live_lat:s.login_lat;if(la!=null)b.push([la,s.live_lng!=null?s.live_lng:s.login_lng]);});
  if(CC.view)m.setView(CC.view.c,CC.view.z,{animate:false});else if(b.length)m.fitBounds(b,{padding:[40,40],maxZoom:15});

function ccAddMarker(s){
  if(!CC.map)return;var la=s.live_lat!=null?s.live_lat:s.login_lat,ln=s.live_lng!=null?s.live_lng:s.login_lng;if(la==null)return;
  var d=ccDrv(s.driver_id),st=ccStale(s);
  var mk=window.L.marker([la,ln],{icon:ccLiveIcon(d&&d.name,st),zIndexOffset:1000}).addTo(CC.map)
    .bindPopup(function(){var x=CC.shifts.filter(function(y){return String(y.id)===String(s.id);})[0]||s;return '<b>'+esc((d&&d.name)||"Driver")+'</b><br>'+esc(x.platform||"")+' · '+(x.speed||0)+' km/h<br>updated '+ccAgo(ccLiveMs(x));});
  mk._stale=st;CC.markers[s.id]=mk;
}
function ccLoadTrails(){
  var ids=ccActive().map(function(s){return String(s.id);});if(!ids.length||!CC.map)return;
  SB.from("shift_points").select("shift_id,lat,lng,recorded_at").in("shift_id",ids).order("recorded_at",{ascending:true}).limit(10000).then(function(r){
    if(r.error||!r.data||!CC.map)return;var by={};
    r.data.forEach(function(p){(by[p.shift_id]=by[p.shift_id]||[]).push([p.lat,p.lng]);});
    Object.keys(by).forEach(function(sid){var ll=by[sid];var s=CC.shifts.filter(function(x){return String(x.id)===sid;})[0];if(s&&s.live_lat!=null)ll.push([s.live_lat,s.live_lng]);
      if(CC.trails[sid])CC.trails[sid].setLatLngs(ll);else CC.trails[sid]=window.L.polyline(ll,{color:"#E3A64A",weight:4,opacity:.85,lineJoin:"round"}).addTo(CC.map);});
  });
}
function ccTrailPoint(sid,lat,lng){sid=String(sid);if(!CC.map||lat==null)return;
  if(CC.trails[sid])CC.trails[sid].addLatLng([lat,lng]);else CC.trails[sid]=window.L.polyline([[lat,lng]],{color:"#E3A64A",weight:4,opacity:.85,lineJoin:"round"}).addTo(CC.map);}
function ccAnimate(mk,to){var from=mk.getLatLng();if(Math.abs(from.lat-to[0])<1e-7&&Math.abs(from.lng-to[1])<1e-7)return;
  if(mk._anim)cancelAnimationFrame(mk._anim);var t0=performance.now();
  var step=function(t){var k=Math.min(1,(t-t0)/900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;mk.setLatLng([from.lat+(to[0]-from.lat)*e,from.lng+(to[1]-from.lng)*e]);mk._anim=k<1?requestAnimationFrame(step):null;};
  mk._anim=requestAnimationFrame(step);}
function ccMove(id){
  var s=CC.shifts.filter(function(x){return String(x.id)===String(id);})[0];if(!s)return;

  }

/* ===== Remember the signed-in role so admin tabs (Command, Admin) show instantly on refresh ===== */
(function(){

  var cached=null;try{cached=localStorage.getItem(KEY);}catch(e){}
  /* while the saved session is being checked (1–2 s), draw the menu for the last known role.
     Data access is still decided by the database (RLS) — this only affects what the menu shows. */
  if(SB_ON&&cached&&hasSession()&&/^(admin|dataentry|viewer)$/.test(cached)){ROLE=cached;READONLY=true;}
  var _apply=applyRole;
  applyRole=function(){
    _apply();
    if(USER){try{localStorage.setItem(KEY,ROLE);}catch(e){}}
    /* the real role is known now: load the Command Center and repaint a Command page that was waiting */
    if(USER&&ROLE==="admin"&&typeof ccLoad==="function"){
      ccLoad().then(function(){var r=getRoute();if(r.indexOf("cc/")===0&&!_rtBusy())renderPage();});
    }
  };
  var _out=doLogout;
  doLogout=function(){try{localStorage.removeItem(KEY);}catch(e){}return _out.apply(this,arguments);};
  /* Command Center data needs the real signed-in session, not the remembered role */
  var _isAdm=ccIsAdmin;
  ccIsAdmin=function(){return _isAdm()&&!!USER;};

  };
})();

(function(){

      '<path class="arc" d="M20 120 A95 95 0 0 1 210 120"/><path class="val" d="M20 120 A95 95 0 0 1 210 120"/>'+ticks+
      '<g class="needle"><path d="M113 120 L115 42 L117 120 z" fill="var(--acc)"/></g><circle class="hub" cx="115" cy="120" r="9"/></svg>'+
      '<div class="kmh"><span id="v3ldN">0</span><small>KM/H · SYNC</small></div></div>'+

    L.hideT=setTimeout(function(){if(!L.el)return;L.el.classList.add("bye");clearInterval(L.iv);clearInterval(L.kv);clearTimeout(L.safety);

/* ===== Data Entry role: add / edit everywhere, never delete (the database blocks it too),

/* ===== Calm refresh: data changes from other users / sync / own saves never blink the screen =====
   - same page re-draws only the page (the header/dock stays), keeps scroll, search, filters, sort, ticks
   - entrance animations run only when you open a different page
   - live changes from others update just the table rows; paused while you type, open a menu or a form
   - the echo of your own save is ignored (nothing changed) */
var CALM={last:null,sig:null,pend:false,t:null,down:false};
function keptView(route){return (CALM.last===route&&view&&typeof view==="object")?view:null;}
function calmSig(){try{return [ROLE,(USER&&USER.email)||"",LANG,SB_ON?1:0,READONLY?1:0].join("|");}catch(e){return "";}}

  if(getRoute()==="finance/new")return true;
  return !!pg.querySelector("textarea, select, input:not(#q):not([data-mssearch]):not([type=checkbox]):not([type=file]):not([type=radio])");
}
function calmBusy(){
  if(typeof _rtBusy==="function"&&_rtBusy())return true;
  if(document.querySelector(".ms-pop:not([hidden]), .popmenu, #rowmenu"))return true;
  var tp=document.getElementById("themepop");if(tp&&!tp.hidden)return true;
  try{var s=window.getSelection&&getSelection();if(s&&!s.isCollapsed&&String(s).trim())return true;}catch(e){}
  return CALM.down;
}
document.addEventListener("pointerdown",function(){CALM.down=true;},true);
document.addEventListener("pointerup",function(){CALM.down=false;},true);
document.addEventListener("pointercancel",function(){CALM.down=false;},true);

function calmRun(){
  if(!CALM.pend)return;
  if(calmBusy()){clearTimeout(CALM.t);CALM.t=setTimeout(calmRun,1200);return;}
  var route=getRoute();
  if(route==="cc"||route.indexOf("cc/")===0){CALM.pend=false;return;}          /* Command Center keeps its own live data */
  var tb=document.getElementById("tbody"),q=document.getElementById("q");
  if(tb&&q&&curEnt&&ENT[curEnt]&&CALM.last===route){                             /* a register: refresh the rows only */
    CALM.pend=false;var y=window.scrollY;try{fillRows(curEnt);}catch(e){renderApp();}
    if(Math.abs(window.scrollY-y)>2)window.scrollTo(0,y);return;
  }
  if(calmFormOpen()){clearTimeout(CALM.t);CALM.t=setTimeout(calmRun,3000);return;}  /* never wipe a half-filled form */
  CALM.pend=false;renderApp();
}
(function(){

/* ===== Attachments: pick many files at once, they show straight away, one Save uploads them all,
   and they appear in the record's Attachments folder right after saving. Older single attachments
   (Attach File / Receipt) keep showing in the same folder. ===== */
var ATT_ACCEPT="image/*,application/pdf",ATT_UP='<path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/>',ATT_PDF='<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>';
function attFields(ent){var c=ENT[ent];return c&&c.fields?c.fields.filter(function(f){return f.t==="file";}):[];}
function attHas(ent){return attFields(ent).length>0;}
function attSrc(x){return x.url||x.data||"";}
function attIsImg(x){var s=attSrc(x);return /^image\//.test(x.mime||"")||/^data:image\//.test(s)||/\.(jpe?g|png|webp|gif)(\?|$)/i.test(s);}
function attIsPdf(x){var s=attSrc(x);return /pdf/.test(x.mime||"")||/^data:application\/pdf/.test(s)||/\.pdf(\?|$)/i.test(s);}
/* every file of a record: new list + older single ones */
function attAll(rec,keys){
  var out=(rec&&rec.files||[]).slice();if(!rec)return out;
  (keys||[]).forEach(function(k){var v=rec[k];if(v&&typeof v==="object"&&(v.url||v.data))out.push({id:"legacy:"+k,name:v.name||rec[k+"Name"]||rec.docName||"Attachment",mime:v.mime||"",url:v.url||v.data,legacy:k});});
  if(rec.receipt&&typeof rec.receipt==="string")out.push({id:"legacy:receipt",name:"Receipt",mime:/^data:image\//.test(rec.receipt)?"image/jpeg":"",url:rec.receipt,legacy:"receipt"});
  return out;
}
function attKeys(ent){return attFields(ent).map(function(f){return f.k;});}
/* file picker kept in the page (a detached input can miss its first pick on some phones) */
var _attInp=null;

  if(_attInp)try{_attInp.remove();}catch(e){}
  var i=document.createElement("input");i.type="file";i.accept=ATT_ACCEPT;i.multiple=true;i.setAttribute("aria-hidden","true");
  i.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";document.body.appendChild(i);_attInp=i;
  i.addEventListener("change",function(){var fs=Array.prototype.slice.call(i.files||[]);setTimeout(function(){try{i.remove();}catch(e){}if(_attInp===i)_attInp=null;},0);if(fs.length)cb(fs);});
  i.click();

/* ===== Orders → Daily Log: date-wise template, mass import (with preview), exports that include
   the daily log, duplicate guard, two-click delete + audit trail, faster one-by-one entry ===== */
var ORD2={keep:null,pending:null};
var OD2_HDR=["Date","Driver","Platform","Vehicle","Orders","Note"];
var OD2_MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
function od2Pad(n){return String(n).padStart(2,"0");}
function od2Iso(y,m,d){var t=new Date(y,m-1,d);if(!y||t.getFullYear()!==y||t.getMonth()!==m-1||t.getDate()!==d)return null;return y+"-"+od2Pad(m)+"-"+od2Pad(d);}
function od2Key(e){return (e.date||"")+"|"+normDriver(e.driver)+"|"+(e.platform||"");}
function od2Lbl(iso){var d=parseD(iso);return d?(d.getDate()+" "+MONS[d.getMonth()]+" "+d.getFullYear()):String(iso||"");}
function od2Next(iso){var d=parseD(iso);if(!d)return iso;d.setDate(d.getDate()+1);return od2Iso(d.getFullYear(),d.getMonth()+1,d.getDate());}
function od2Serial(iso){var d=parseD(iso);return d?Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+25569:iso;}
/* any date an Excel cell can hold → YYYY-MM-DD (day-first for typed text, as used in Kuwait) */
function od2Date(v){
  if(v==null||v==="")return null;
  if(v instanceof Date&&!isNaN(v))return od2Iso(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==="number"&&isFinite(v)){if(v<20000||v>80000)return null;var u=new Date(Math.round((v-25569)*864e5));return od2Iso(u.getUTCFullYear(),u.getUTCMonth()+1,u.getUTCDate());}
  var s=String(v).trim(),m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return od2Iso(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return od2Iso(y,+m[2],+m[1]);}
  if((m=s.match(/^(\d{1,2})[\s\-\/]*([A-Za-z]{3,})[\s,\-\/]*(\d{2,4})$/))){var mo=OD2_MON[m[2].slice(0,3).toUpperCase()],y2=+m[3];if(y2<100)y2+=2000;return mo?od2Iso(y2,mo,+m[1]):null;}

/* ---------- import: read the workbook ---------- */
function od2Parse(wb){
  var got=[],errs=[],any=false;
  function up(x){return String(x==null?"":x).trim().toUpperCase();}
  wb.SheetNames.forEach(function(sn){
    var aoa;try{aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",blankrows:true,raw:true});}catch(e){return;}
    for(var hi=0;hi<Math.min(8,aoa.length);hi++){
      var H=(aoa[hi]||[]).map(up);
      var fi=function(fn){for(var i=0;i<H.length;i++)if(fn(H[i]))return i;return -1;};
      var cDrv=fi(function(s){return /DRIVER|RIDER|^NAME/.test(s);}),cDate=fi(function(s){return s==="DATE"||/^DATE\b|DAY DATE|ENTRY DATE/.test(s);}),cOrd=fi(function(s){return /ORDER/.test(s);});
      var cPl=fi(function(s){return /PLATFORM/.test(s);}),cVeh=fi(function(s){return /VEHICLE/.test(s);}),cNote=fi(function(s){return /NOTE|REMARK/.test(s);});
      var dayCols={};H.forEach(function(s,i){if(/^\d{1,2}$/.test(s)&&+s>=1&&+s<=31)dayCols[i]=+s;});
      var nDay=Object.keys(dayCols).length;
      if(cDrv>=0&&cDate>=0&&cOrd>=0){ any=true; /* long format */
        for(var r=hi+1;r<aoa.length;r++){var row=aoa[r]||[],rn=r+1;
          var rawD=row[cDate],drv=normDriver(String(row[cDrv]||"")),rawO=row[cOrd];
          if((rawD===""||rawD==null)&&!drv&&(rawO===""||rawO==null))continue;
          var at=sn+" row "+rn,dt=od2Date(rawD),pl=normPlat(cPl>=0?row[cPl]:""),o=num(rawO);
          if(!dt){errs.push([at,"Date not understood: “"+String(rawD)+"”"]);continue;}
          if(!drv){errs.push([at,"Driver name missing"]);continue;}
          if(pl!=="Talabat"&&pl!=="Keeta"){errs.push([at,"Platform must be Talabat or Keeta"+(pl?" (found “"+pl+"”)":"")]);continue;}
          if(rawO===""||rawO==null){errs.push([at,"Orders missing"]);continue;}
          if(o==null||o<0||Math.round(o)!==o){errs.push([at,"Orders must be a whole number (found “"+String(rawO)+"”)"]);continue;}
          got.push({date:dt,driver:drv,platform:pl,vehicle:up(cVeh>=0?row[cVeh]:""),orders:o,note:String(cNote>=0?row[cNote]:"").trim(),hasNote:cNote>=0,at:at});
        }
        break;
      }
      if(cDrv>=0&&nDay>=7){ any=true; /* month grid */
        var cMon=fi(function(s){return s==="MONTH";}),cYr=fi(function(s){return s==="YEAR";});
        for(var r2=hi+1;r2<aoa.length;r2++){var rw=aoa[r2]||[],rn2=r2+1,dr=normDriver(String(rw[cDrv]||""));
          var vals=Object.keys(dayCols).filter(function(ci){return rw[ci]!==""&&rw[ci]!=null;});
          if(!dr&&!vals.length)continue;
          var at2=sn+" row "+rn2;
          if(!vals.length)continue; /* driver listed but nothing typed — fine */
          if(!dr){errs.push([at2,"Driver name missing"]);continue;}
          var pl2=normPlat(cPl>=0?rw[cPl]:"");if(pl2!=="Talabat"&&pl2!=="Keeta"){errs.push([at2,"Platform must be Talabat or Keeta"]);continue;}
          var mo=cMon>=0?(OD2_MON[up(rw[cMon]).slice(0,3)]||(+rw[cMon]>=1&&+rw[cMon]<=12?+rw[cMon]:0)):0,yr=cYr>=0?parseInt(rw[cYr],10):0;
          if(!mo||!yr){errs.push([at2,"Month / Year missing"]);continue;}
          vals.forEach(function(ci){var v=num(rw[ci]),day=dayCols[ci],iso=od2Iso(yr,mo,day);
            if(!iso){errs.push([at2,"Day "+day+" doesn’t exist in "+MONS[mo-1]+" "+yr]);return;}
            if(v==null||v<0||Math.round(v)!==v){errs.push([at2,"Day "+day+": orders must be a whole number (found “"+String(rw[ci])+"”)"]);return;}
            got.push({date:iso,driver:dr,platform:pl2,vehicle:up(cVeh>=0?rw[cVeh]:""),orders:v,note:"",hasNote:false,grid:true,at:at2+" · day "+day});});
        }
        break;
      }
    }
  });
  if(!any)return null;
  /* duplicates are never imported:
     - the same driver + date + platform twice in this file → both rows blocked (unless they are identical)
     - already in the Daily Log with a different number → blocked (change it with ✎ instead)
     - already in the Daily Log with the same number → simply "already saved" */
  var map={},order=[],fileDup=[],bad={};
  got.forEach(function(g){var k=od2Key(g);
    if(map[k]){if(map[k].orders!==g.orders){if(!bad[k]){bad[k]=1;fileDup.push({g:map[k],why:"Entered twice in this file ("+map[k].at+" = "+map[k].orders+", "+g.at+" = "+g.orders+")"});}}return;}
    order.push(k);map[k]=g;});
  var cur={};(STATE.grd.orderlog||[]).forEach(function(e){var k=od2Key(e);if(!cur[k])cur[k]=e;});
  var add=[],same=[],dup=fileDup.slice();
  order.forEach(function(k){if(bad[k])return;var g=map[k],e=cur[k];
    if(!e){add.push(g);return;}
    if(num(e.orders)===g.orders)same.push(g);

  var known={};(STATE.grd.drivers||[]).forEach(function(d){if(d.name)known[normDriver(d.name)]=1;});(STATE.grd.orderlog||[]).forEach(function(e){known[normDriver(e.driver)]=1;});(STATE.grd.perf||[]).forEach(function(e){known[normDriver(e.driver)]=1;});
  var unk={};add.forEach(function(g){var d=g.driver;if(!known[d])unk[d]=1;});
  var months={};order.forEach(function(k){months[map[k].date.slice(0,7)]=1;});
  return {add:add,dup:dup,same:same,errs:errs,unknown:Object.keys(unk).sort(),months:Object.keys(months).sort(),total:order.length};
}

/* ---- the money ---- */
function payOrdersFor(d,mk){
  var n=normDriver(d&&d.name),o=0,by={},days={};
  if(!n||!mk)return {orders:0,by:by,days:0};
  (STATE.grd.orderlog||[]).forEach(function(e){if(String(e.date||"").slice(0,7)!==mk)return;if(normDriver(e.driver)!==n)return;
    var v=num(e.orders)||0;o+=v;var p=e.platform||"—";by[p]=(by[p]||0)+v;days[e.date]=1;});
  return {orders:o,by:by,days:Object.keys(days).length};
}
function payBase(d,mk){
  var prof=profOf(d),z={prof:prof,base:0,orders:0,by:{},days:0};
  if(prof==="None"||!mk||mk<PAYROLL_START_MK)return z;
  if(prof==="Office"){z.base=num(d.salary)||0;return z;}
  var o=payOrdersFor(d,mk);z.orders=o.orders;z.by=o.by;z.days=o.days;z.base=Math.round(o.orders*PAY_RATE*1000)/1000;return z;
}
/* who is on payroll for a month: Office always; Driver when Active or when they have orders that month; None never */
payEmployees=function(mk){
  mk=mk||payMK_sel||mKeyOf(TODAY);
  return (STATE.grd.drivers||[]).filter(function(d){
    if(!d.name)return false;var p=profOf(d);
    if(p==="None")return false;if(p==="Office")return true;
    return String(d.status||"").trim().toUpperCase()==="ACTIVE"||payOrdersFor(d,mk).orders>0;
  });
};
var _paySlip=payslipFor;
payslipFor=function(d,mk){
  var r=_paySlip(d,mk),b=payBase(d,mk),start=PAYROLL_START_MK+"-01";
  var keep=function(x){return !x.date||String(x.date)>=start;};  /* nothing dated before payroll started */
  r.sal=r.sal.filter(keep);r.adv=r.adv.filter(keep);r.inc=r.inc.filter(keep);r.food=r.food.filter(keep);r.recov=r.recov.filter(keep);
  var sum=function(a){return a.reduce(function(s,x){return s+x.amount;},0);};
  r.salaryPaid=sum(r.sal);r.incentive=sum(r.inc);r.foodT=sum(r.food);r.advance=sum(r.adv);r.recovT=sum(r.recov);
  r.prof=b.prof;r.orders=b.orders;r.byPlat=b.by;r.days=b.days;r.rate=PAY_RATE;r.basic=b.base;
  r.additions=r.incentive+r.foodT;r.deductions=r.advance+r.recovT;r.gross=r.basic+r.additions;r.net=r.gross-r.deductions;r.paid=r.salaryPaid>0;
  return r;
};

    var n=NAV[+btn.getAttribute("data-mi")];
    if(n.items)openSheet(n); else {closeSheet();location.hash="#/"+n.r;}
  });
  sheet.addEventListener("click",function(e){
    var b=e.target.closest("[data-go]"); if(!b)return;
    closeSheet();location.hash="#/"+b.getAttribute("data-go");
  });
  function updateBar(){
    bar.querySelectorAll("button").forEach(function(btn,i){btn.classList.toggle("active",navItemActive(NAV[i]));});
  }

  // ---- auto-hide: bar shows on tap/scroll, then hides after a short idle ----
  var hideT, HIDE_MS=2800;
  function isMobile(){try{return window.matchMedia("(max-width:860px)").matches;}catch(e){return window.innerWidth<=860;}}
  function showBar(){
    if(!isMobile())return;
    bar.classList.remove("mb-hide");
    clearTimeout(hideT);
    hideT=setTimeout(function(){ if(!sheet.classList.contains("on")) bar.classList.add("mb-hide"); }, HIDE_MS);
  }
  bar.classList.add("mb-hide");   // start hidden
  ["touchstart","pointerdown","click","scroll","keydown"].forEach(function(ev){
    document.addEventListener(ev, showBar, {passive:true});
  });
  window.addEventListener("hashchange",showBar);

  // ---- responsive tables: give each cell a data-label from its header ----
  function labelize(){
    var page=document.getElementById("page"); if(!page)return;
    page.querySelectorAll("table.dt").forEach(function(t){
      var ths=t.querySelectorAll("thead th");
      var labs=[].map.call(ths,function(th){var c=th.cloneNode(true);var s=c.querySelector(".sar");if(s)s.remove();return (c.textContent||"").trim();});
      t.querySelectorAll("tbody tr").forEach(function(tr){
        [].forEach.call(tr.children,function(td,i){ if(!td.hasAttribute("data-label")) td.setAttribute("data-label", labs[i]||""); });
      });
    });
  }
  function tick(){updateBar();labelize();}
  var root=document.getElementById("root");
  if(root)new MutationObserver(function(){setTimeout(tick,0);}).observe(root,{childList:true,subtree:false});
  window.addEventListener("hashchange",function(){setTimeout(tick,60);});
  setInterval(tick,1200); setTimeout(tick,500); setTimeout(tick,1400);
})();

</script>
<script id="tb-mod">
/* DEMO: add a compact record-count on the right of the register toolbar (Axanta-style) */
(function(){
  function enhance(){
    var page=document.getElementById("page"); if(!page)return;
    var tb=page.querySelector(".toolbar"); if(!tb)return;
    var c=tb.querySelector(".reg-count");
    if(!c){ c=document.createElement("span"); c.className="reg-count";
      var add=tb.querySelector('[data-act="new"]'); tb.insertBefore(c, add||null); }
    var rows=page.querySelectorAll(".dt tbody tr");
    var n=[].filter.call(rows,function(r){return !r.querySelector("td[colspan]");}).length;
    c.innerHTML='<b>'+n+'</b> records';
  }
  var root=document.getElementById("root");
  if(root)new MutationObserver(function(){setTimeout(enhance,0);}).observe(root,{childList:true,subtree:false});
  window.addEventListener("hashchange",function(){setTimeout(enhance,60);});
  setInterval(enhance,900);setTimeout(enhance,500);setTimeout(enhance,1400);
})();

</script>
