/* ============ FINANCE ANALYTICS ============ */
function eAmt(e){return num(e.amount)||0;}
function mKey(e){var d=parseD(e.date);if(d)return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");var mi=MON.indexOf(e.month);if(mi>=0)return TODAY.getFullYear()+"-"+String(mi+1).padStart(2,"0");return "";}
function mKeyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
/* ---- Petty cash / accounting helpers ---- */
function isPettyPay(e){return !/company\s*a\/?c|company\s*account/i.test(e.payment||"");} // Company A/C paid = not from petty cash
function isRecov(e){return /^y/i.test(e.recoverable||"");}       // recoverable from driver
function isRecovered(e){return /^y/i.test(e.recovered||"");}
function isFixed(e){return /fixed/i.test(e.costType||"");}
function pettyBalance(){ // current running petty-cash balance (all-time): total funds in − petty-cash spends
  var fin=(STATE.finance.funds||[]).reduce(function(a,f){return a+(num(f.amount)||0);},0);
  var out=(STATE.finance.expenses||[]).filter(isPettyPay).reduce(function(a,e){return a+(num(e.amount)||0);},0);
  return fin-out;
}
function recoverableOutstanding(){return (STATE.finance.expenses||[]).filter(function(e){return isRecov(e)&&!isRecovered(e);}).reduce(function(a,b){return a+(num(b.amount)||0);},0);}
function prettyMonth(mk){var p=mk.split("-");return MONS[(+p[1])-1]+" '"+p[0].slice(2);}
function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
function stdev(a,m){if(a.length<2)return 0;var v=a.reduce(function(x,y){return x+(y-m)*(y-m);},0)/a.length;return Math.sqrt(v);}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var finPeriod="all";
function periodLabel(p){return {all:"All time",this:"This month",last:"Last month",q:"Last 3 months",year:"This year"}[p]||"All time";}
function inPeriod(e,p){var mk=mKey(e);if(!mk)return p==="all";
  var tm=mKeyOf(TODAY);
  if(p==="this")return mk===tm;
  if(p==="last")return mk===mKeyOf(new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1));
  if(p==="q"){var cut=mKeyOf(new Date(TODAY.getFullYear(),TODAY.getMonth()-2,1));return mk>=cut;}
  if(p==="year")return mk.slice(0,4)===String(TODAY.getFullYear());
  return true;}

function computeInsights(ex){
  var out=[],ar=LANG==="ar";function tc(c){return ar?(I18N[c]||c):c;}
  if(ex.length<4)return out;
  var byVeh={};ex.forEach(function(e){var v=(e.plate||"").trim();if(!v)return;byVeh[v]=(byVeh[v]||0)+eAmt(e);});
  var vehKeys=Object.keys(byVeh);
  if(vehKeys.length>=3){var vals=vehKeys.map(function(k){return byVeh[k];});var m=avg(vals),sd=stdev(vals,m);
    vehKeys.slice().sort(function(a,b){return byVeh[b]-byVeh[a];}).slice(0,1).forEach(function(top){
      if(byVeh[top]>m+1.4*sd&&byVeh[top]>m*1.6)out.push({sev:"danger",cat:"High-spend vehicle",
        title:ar?("المركبة "+top+" هي الأعلى تكلفة"):("Vehicle "+top+" is your biggest cost"),
        detail:ar?("الإجمالي "+money(byVeh[top])+" د.ك — نحو "+(byVeh[top]/(m||1)).toFixed(1)+"× متوسط المركبة. يستحق المراجعة."):("Total "+money(byVeh[top])+" KWD — about "+(byVeh[top]/(m||1)).toFixed(1)+"× the average vehicle. Worth a review.")});});}
  var fvm={};ex.forEach(function(e){if(!/fuel/i.test(e.category||""))return;var v=(e.plate||"").trim(),mk=mKey(e);if(!v||!mk)return;fvm[v]=fvm[v]||{};fvm[v][mk]=(fvm[v][mk]||0)+eAmt(e);});
  Object.keys(fvm).forEach(function(v){var ms=Object.keys(fvm[v]).sort();if(ms.length<3)return;var last=ms[ms.length-1];var prev=ms.slice(0,-1).map(function(m){return fvm[v][m];});var pm=avg(prev);if(pm>0&&fvm[v][last]>pm*1.7)out.push({sev:"warn",cat:"Fuel spike",
    title:ar?("قفزة وقود في "+v):("Fuel jump on "+v),
    detail:ar?("وقود "+v+" في "+prettyMonth(last)+" كان "+money(fvm[v][last])+" د.ك — "+(fvm[v][last]/pm).toFixed(1)+"× المعتاد "+money(pm)+". قد يكون تسريب أو سوء استخدام أو إدخال خاطئ."):("Fuel for "+v+" in "+prettyMonth(last)+" was "+money(fvm[v][last])+" KWD — "+(fvm[v][last]/pm).toFixed(1)+"× its usual "+money(pm)+". Possible leak, misuse or wrong entry.")});});
  var byCatE={};ex.forEach(function(e){var c=e.category||"Other";(byCatE[c]=byCatE[c]||[]).push(e);});
  Object.keys(byCatE).forEach(function(c){var arr=byCatE[c];if(arr.length<5)return;var vals=arr.map(eAmt),m=avg(vals),sd=stdev(vals,m);arr.forEach(function(e){var a=eAmt(e);if(a>m+3*sd&&a>m*2.2)out.push({sev:"danger",cat:"Unusual entry",
    title:ar?("إدخال "+tc(c)+" كبير"):("Large "+c+" entry"),
    detail:ar?(money(a)+" د.ك في "+fmtD(e.date)+(e.plate?" ("+e.plate+")":"")+(e.driver?" · "+e.driver:"")+" — أعلى بكثير من المعتاد "+money(m)+" لـ"+tc(c)+". تحقّق منه."):(money(a)+" KWD on "+fmtD(e.date)+(e.plate?" ("+e.plate+")":"")+(e.driver?" · "+e.driver:"")+" — far above the usual "+money(m)+" for "+c+". Double-check it."),eid:e.id});});});
  var seen={};ex.forEach(function(e){if(eAmt(e)<=0)return;var k=(e.plate||"?")+"|"+(e.category||"?")+"|"+(e.date||"?")+"|"+eAmt(e).toFixed(3);(seen[k]=seen[k]||[]).push(e);});
  Object.keys(seen).forEach(function(k){if(seen[k].length>1){var p=k.split("|");out.push({sev:"warn",cat:"Possible duplicate",
    title:ar?"إدخالات مكررة":"Duplicate entries",
    detail:ar?(seen[k].length+" إدخالات متطابقة لـ"+tc(p[1]!=="?"?p[1]:"مصروف")+" بقيمة "+money(+p[3])+" د.ك"+(p[0]!=="?"?" لـ"+p[0]:"")+" في "+fmtD(p[2])+". قد يكون إدخالًا مكررًا."):(seen[k].length+" identical "+(p[1]!=="?"?p[1]:"expense")+" entries of "+money(+p[3])+" KWD"+(p[0]!=="?"?" for "+p[0]:"")+" on "+fmtD(p[2])+". Could be a double entry.")});}});
  var tm=mKeyOf(TODAY),lm=mKeyOf(new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1));
  var ct={},cl={};ex.forEach(function(e){var mk=mKey(e),c=e.category||"Other";if(mk===tm)ct[c]=(ct[c]||0)+eAmt(e);else if(mk===lm)cl[c]=(cl[c]||0)+eAmt(e);});
  Object.keys(ct).forEach(function(c){var t=ct[c],l=cl[c]||0;if(l>=10&&t>l*1.6)out.push({sev:"info",cat:"Trend",
    title:ar?(tc(c)+" ارتفع هذا الشهر"):(c+" up this month"),
    detail:ar?(tc(c)+" ارتفع "+Math.round((t-l)/l*100)+"% عن الشهر الماضي ("+money(l)+" ← "+money(t)+" د.ك)."):(c+" rose "+Math.round((t-l)/l*100)+"% vs last month ("+money(l)+" → "+money(t)+" KWD).")});});
  var mc={};ex.forEach(function(e){if(/mainten/i.test(e.category||"")){var v=(e.plate||"").trim();if(v)mc[v]=(mc[v]||0)+1;}});
  Object.keys(mc).forEach(function(v){if(mc[v]>=3)out.push({sev:"warn",cat:"Repeat repairs",
    title:ar?("المركبة "+v+" تُصلَّح كثيرًا"):("Vehicle "+v+" repaired often"),
    detail:ar?(mc[v]+" إدخالات صيانة لـ"+v+". المركبة كثيرة الأعطال قد تكلّف أكثر من قيمتها."):(mc[v]+" maintenance entries logged for "+v+". A frequently-repaired vehicle may cost more than it's worth.")});});
  var rank={danger:0,warn:1,info:2};out.sort(function(a,b){return rank[a.sev]-rank[b.sev];});
  return out.slice(0,7);
}

  return items.length?items.map(function(i){var p=Math.max(2,i.value/max*100);return '<div class="barrow" data-tt="'+esc(i.label)+': '+money(i.value)+' KWD"><div class="bl" style="width:150px">'+esc(i.label)+'</div><div class="bt"><div class="bf" style="width:'+p+'%;background:'+color+'"></div></div><div class="bv mono" style="width:58px">'+money(i.value)+'</div></div>';}).join(""):'<div class="empty" style="padding:18px">No data in this period.</div>';}

var PAYROLL_START_MK="2026-09"; // fleet payroll begins Sep 2026 — no months before this
function payMonthList(){ // Sep 2026 forward, up to current month (chronological)
  var out=[],sp=PAYROLL_START_MK.split("-"),d=new Date(+sp[0],+sp[1]-1,1),end=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  while(d<=end){out.push(mKeyOf(d));d=new Date(d.getFullYear(),d.getMonth()+1,1);}

  return out;

// which payroll month a salary/wage expense counts in (explicit For-Month wins, else the date)
function wageMK(e){
  if(e.wmonth){var mi=MON.indexOf(e.wmonth);if(mi>=0){var d=parseD(e.date);var y=num(e.wyear)||(d?d.getFullYear():TODAY.getFullYear());return y+"-"+String(mi+1).padStart(2,"0");}}
  return mKey(e);
}
function mkIndex(mk){var p=(mk||"").split("-");return (+p[0])*12+((+p[1])-1);}
// installment share of a recoverable item for a given payroll month (start = entry month)
function recovPart(r,amtKey,mk){
  var total=num(r[amtKey])||0;if(total<=0)return null;
  var start=mKey(r);if(!start)return null;
  var n=Math.max(1,Math.round(num(r.installments)||1));
  if(!mk)return {amount:total,inst:(n>1?"1/"+n:"")};
  var idx=mkIndex(mk)-mkIndex(start);
  if(idx<0||idx>=n)return null;                 // this month is outside the installment window
  var per=Math.round(total/n*1000)/1000;
  var amt=(idx===n-1)?Math.round((total-per*(n-1))*1000)/1000:per;  // last one absorbs rounding
  return {amount:amt,inst:(n>1?(idx+1)+"/"+n:"")};
}
// full payslip for one employee in a month-key
function payslipFor(d,mk){
  var name=(d.name||"").trim();
  var basic=num(d.salary)||0;
  var sal=[],adv=[],inc=[],food=[];
  (STATE.finance.expenses||[]).forEach(function(e){
    if((e.driver||"").trim()!==name)return;
    if(!/salar|wage/i.test(e.category||""))return;            // only Salaries & Wages
    if(mk&&wageMK(e)!==mk)return;
    var sub=(e.sub||""),amt=eAmt(e);if(amt<=0)return;
    if(/advance/i.test(sub))adv.push({label:"Advance Payment",amount:amt,date:e.date});
    else if(/incentive/i.test(sub))inc.push({label:"Incentive",amount:amt,date:e.date});
    else if(/food/i.test(sub))food.push({label:"Food Allowance",amount:amt,date:e.date});
    else sal.push({label:(sub||"Salary"),amount:amt,date:e.date});   // base Salary
  });
  // recoverable-unrecovered deductions: fleet-ops + non-salary expenses (with installments)
  var recov=[];
  function addR(list,amtKey,src){(list||[]).forEach(function(r){
    if(!isRecov(r)||isRecovered(r))return;
    if((r.recoverFrom||"").trim()!==name)return;
    var p=recovPart(r,amtKey,mk);if(!p||p.amount<=0)return;
    recov.push({src:src,amount:p.amount,date:r.date,label:(r.reason||r.type||r.category||src),inst:p.inst});
  });}
  (STATE.finance.expenses||[]).forEach(function(e){
    if(/salar|wage/i.test(e.category||""))return;             // salary handled above
    if(!isRecov(e)||isRecovered(e))return;
    if((e.recoverFrom||"").trim()!==name)return;
    var p=recovPart(e,"amount",mk);if(!p||p.amount<=0)return;
    recov.push({src:"Expense",amount:p.amount,date:e.date,label:(e.category||"Expense"),inst:p.inst});
  });
  addR(STATE.grd.fines,"amount","Fine");
  addR(STATE.grd.incidents,"cost","Incident");
  addR(STATE.grd.maintenance,"cost","Maintenance");
  var salaryPaid=sal.reduce(function(a,x){return a+x.amount;},0);
  var incentive=inc.reduce(function(a,x){return a+x.amount;},0);
  var foodT=food.reduce(function(a,x){return a+x.amount;},0);
  var advance=adv.reduce(function(a,x){return a+x.amount;},0);
  var recovT=recov.reduce(function(a,x){return a+x.amount;},0);
  var additions=incentive+foodT, deductions=advance+recovT, gross=basic+additions;
  return {d:d,basic:basic,sal:sal,inc:inc,food:food,adv:adv,recov:recov,
    salaryPaid:salaryPaid,incentive:incentive,foodT:foodT,advance:advance,recovT:recovT,
    additions:additions,deductions:deductions,gross:gross,net:gross-deductions,paid:salaryPaid>0};
}

function loadSampleExpenses(){
  var plates=STATE.grd.vehicles.map(function(v){return v.plate;}).filter(Boolean);
  if(plates.length<4)plates=["22-15047","22-15886","22-15242","33-10011","44-20022","55-30033"];
  plates=plates.slice(0,8);
  var drivers=STATE.grd.drivers.map(function(d){return d.name;}).filter(Boolean);
  var subs=STATE.lookups.subcategories,plats=L("platforms"),pays=L("payments");
  function rnd(n){return Math.floor(Math.random()*n);}function pick(a){return a.length?a[rnd(a.length)]:"";}
  var ex=[];
  function add(daysAgo,cat,amount,plate,drv){var d=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-daysAgo);var sub=(subs[cat]&&subs[cat].length)?pick(subs[cat]):"";
    ex.push({id:uid("e"),demo:true,date:iso(d),month:MON[d.getMonth()],category:cat,sub:sub,vehType:/bike/i.test(cat)?"Bike":"Car",plate:plate,driver:drv||pick(drivers),platform:pick(plats),payment:pick(pays),amount:String(amount),notes:"sample"});}
  for(var i=0;i<42;i++){var cat=pick(["Fuel","Fuel","Fuel","Vehicle/Bike Maintenance","Salaries & Wages","Government/Legal Fees","Communication","Insurance"]);
    var amt=cat==="Fuel"?(6+rnd(9)):cat==="Salaries & Wages"?(80+rnd(70)):cat==="Insurance"?(30+rnd(40)):(4+rnd(28));
    add(rnd(88),cat,amt.toFixed(3),pick(plates));}
  // deliberate anomalies
  add(4,"Vehicle/Bike Maintenance","465.000",plates[0]);
  add(3,"Fuel","62.000",plates[1]);add(3,"Fuel","62.000",plates[1]);
  add(2,"Government/Legal Fees","180.000",plates[0]);
  add(38,"Fuel","8.000",plates[1]);add(64,"Fuel","9.000",plates[1]);
  add(6,"Vehicle/Bike Maintenance","35.000",plates[0]);add(20,"Vehicle/Bike Maintenance","40.000",plates[0]);
  STATE.finance.expenses=ex.concat(STATE.finance.expenses);
  persist();renderApp();toast("Loaded "+ex.length+" sample expenses.","good");
}

function shortLab(s){var t=String(s||"");if(t.slice(0,4).toLowerCase()==="all ")t=t.slice(4);if(/ies$/.test(t))t=t.slice(0,-3)+"y";else if(/ses$/.test(t))t=t.slice(0,-2);else if(/s$/.test(t))t=t.slice(0,-1);return t.charAt(0).toUpperCase()+t.slice(1);}
function msFilter(ent,f){
  var opts=f.opts?L(f.opts):distinct(store(ent),f.k);
  var sel=view.filters[f.k]||[];
  var valTxt=sel.length?(sel.length===1?sel[0]:sel.length+" selected"):shortLab(f.lab);
  return '<div class="ms" data-mskey="'+f.k+'">'+
    '<button class="ms-btn" data-msbtn type="button"><span class="ms-val'+(sel.length?" has":"")+'">'+esc(valTxt)+'</span>'+(sel.length>1?'<span class="ms-cnt">'+sel.length+'</span>':"")+'<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>'+

function commitMS(ms,key){

// add picked files to the pending queue (one at a time or several) — nothing saves yet

  Array.prototype.slice.call(fileList).forEach(function(f){DOCSTAGE.push({file:f,sel:"",other:""});});
  renderStage();
}

    '<div class="dp-list">'+DOCSTAGE.map(function(it,i){
      var isImg=/^image\//.test(it.file.type);
      return '<div class="dp-row" data-si="'+i+'"><div class="dp-name">'+svg(isImg?'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/>':'<path d="M6 2h8l4 4v16H6z"/><path d="M14 2v4h4"/>')+'<span class="t" title="'+esc(it.file.name)+'">'+esc(it.file.name)+'</span><span class="sz">'+fmtSize(it.file.size)+'</span></div>'+
        '<select class="dp-type"><option value="">— type —</option>'+DOCTYPES.map(function(t){return '<option'+(it.sel===t?' selected':'')+'>'+t+'</option>';}).join("")+'</select>'+
        '<input class="dp-other" placeholder="Specify name" value="'+esc(it.other||"")+'"'+(it.sel==="Other"?"":" hidden")+'>'+
        '<button class="dp-rm" title="Remove" data-si="'+i+'">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div>';
    }).join("")+'</div>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="stageClear">Clear queue</button><button class="btn primary" id="stageSave">'+svg('<path d="M20 6 9 17l-5-5"/>')+'Save '+DOCSTAGE.length+' document'+(DOCSTAGE.length>1?"s":"")+'</button></div>';
  wrap.querySelectorAll(".dp-row").forEach(function(row){
    var i=+row.getAttribute("data-si");var sel=row.querySelector(".dp-type"),oth=row.querySelector(".dp-other");
    sel.addEventListener("change",function(){DOCSTAGE[i].sel=sel.value;oth.hidden=sel.value!=="Other";});
    oth.addEventListener("input",function(){DOCSTAGE[i].other=oth.value;});
    row.querySelector(".dp-rm").addEventListener("click",function(){DOCSTAGE.splice(i,1);renderStage();});
  });
  wrap.querySelector("#stageClear").addEventListener("click",function(){DOCSTAGE=[];renderStage();});
  wrap.querySelector("#stageSave").addEventListener("click",function(){
    var items=[],missing=false;
    DOCSTAGE.forEach(function(it){var t=it.sel==="Other"?(it.other||"").trim():it.sel;if(!t){missing=true;return;}items.push({file:it.file,type:t});});
    if(missing){toast("Choose a type for every file first.","err");return;}
    DOCSTAGE=[];saveDocsBatch(_docD,items);
  });
}

    if(missing){toast("Please choose a type for every file.","err");return;}
    saveDocsBatch(d,items);
  });
}
// prepare one doc (read + resize images) → resolves to a doc object with dataURL
function prepDoc(d,file,type){
  return new Promise(function(resolve,reject){
    var MAX=4.5*1024*1024;var reader=new FileReader();
    if(/^image\//.test(file.type)){
      reader.onload=function(){var img=new Image();img.onload=function(){
        var mx=1500,sc=Math.min(1,mx/Math.max(img.width,img.height));
        var cw=Math.max(1,Math.round(img.width*sc)),ch=Math.max(1,Math.round(img.height*sc));
        var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
        var data;try{data=cv.toDataURL("image/jpeg",0.82);}catch(e){data=reader.result;}
        resolve({id:uid("doc"),type:type,name:file.name,mime:"image/jpeg",size:Math.round(data.length*0.73),data:data,at:new Date().toISOString()});
      };img.onerror=function(){resolve({id:uid("doc"),type:type,name:file.name,mime:file.type,size:file.size,data:reader.result,at:new Date().toISOString()});};img.src=reader.result;};
      reader.onerror=function(){reject();};reader.readAsDataURL(file);
    } else {
      if(file.size>MAX){toast("Skipped "+file.name+" — too large (max ~4 MB).","err");reject();return;}
      reader.onload=function(){resolve({id:uid("doc"),type:type,name:file.name,mime:file.type||"application/octet-stream",size:file.size,data:reader.result,at:new Date().toISOString()});};
      reader.onerror=function(){reject();};reader.readAsDataURL(file);
    }
  });
}

// re-render the docs modal AND the detail page behind it, so uploads/deletes show instantly (no manual refresh)
function refreshDocHost(d){var dd=drById(d.id)||d;renderDocsModal(dd);if(curEnt==="drivers"&&getRoute().indexOf("grd/drivers/"+dd.id)===0){var pg=$("#page");if(pg)pageDetail(pg,"drivers",dd.id);}fillRowsIfDrivers();}
function saveDocsBatch(d,items){
  if(!items.length)return;
  showLoader("Uploading "+items.length+" document"+(items.length>1?"s":"")+"…");
  var out=[];var chain=Promise.resolve();
  items.forEach(function(it){chain=chain.then(function(){
    return prepDoc(d,it.file,it.type).then(function(doc){
      if(SB_ON&&/^data:/.test(doc.data||"")){return sbUpload("drivers/"+d.id+"/doc-"+doc.id+"."+extFor(doc.mime),dataURLtoBlob(doc.data),doc.mime).then(function(url){doc.data=url;out.push(doc);}).catch(function(){out.push(doc);});}
      out.push(doc);
    }).catch(function(){});
  });});
  chain.then(function(){
    var live=drById(d.id)||d; // always mutate the CURRENT state object (realtime echo may have replaced it)
    if(!live.docs)live.docs=[];
    for(var i=out.length-1;i>=0;i--)live.docs.unshift(out[i]);
    if(out.length)logAudit("edit","drivers",live.id,recLabel("drivers",live),[{f:"docs",l:"Documents",from:"",to:"added "+out.length+" file(s)"}]);
    persist();
    hideLoader();refreshDocHost(live);
    toast("Saved "+out.length+" document(s).","good");
  }).catch(function(){hideLoader();refreshDocHost(drById(d.id)||d);});
}
function pickDoc(d,file){
  var body=document.getElementById("docBody");if(!body)return;
  body.innerHTML='<div class="banner info" style="margin-bottom:16px">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+'<div>Which document is <b>'+esc(file.name)+'</b> <span class="mono" style="opacity:.7">('+fmtSize(file.size)+')</span>?</div></div>'+
    '<div class="field"><label>Document type <span class="req">*</span></label><select id="docType"><option value="">— select —</option>'+DOCTYPES.map(function(t){return '<option>'+t+'</option>';}).join("")+'</select></div>'+
    '<div class="field" id="docOtherWrap" hidden style="margin-top:12px"><label>Specify document name</label><input id="docOther" placeholder="e.g. Bank Letter"></div>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-act="docback">Cancel</button><button class="btn primary" id="docSaveBtn">'+svg('<path d="M20 6 9 17l-5-5"/>')+'Save document</button></div>';
  var ts=body.querySelector("#docType");
  ts.addEventListener("change",function(){body.querySelector("#docOtherWrap").hidden=ts.value!=="Other";});
  body.querySelector("#docSaveBtn").addEventListener("click",function(){
    var t=ts.value;if(!t){toast("Please choose the document type.","err");return;}
    if(t==="Other"){var o=(body.querySelector("#docOther").value||"").trim();if(!o){toast("Please name the document.","err");return;}t=o;}
    saveDoc(d,file,t);
  });
  setTimeout(function(){ts.focus();},40);
}
function saveDoc(d,file,type){
  var MAX=4.5*1024*1024;
  var reader=new FileReader();
  if(/^image\//.test(file.type)){
    reader.onload=function(){var img=new Image();img.onload=function(){
      var mx=1500,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var cw=Math.max(1,Math.round(img.width*sc)),ch=Math.max(1,Math.round(img.height*sc));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
      var data;try{data=cv.toDataURL("image/jpeg",0.82);}catch(e){data=reader.result;}
      commitDoc(d,{id:uid("doc"),type:type,name:file.name,mime:"image/jpeg",size:Math.round(data.length*0.73),data:data,at:new Date().toISOString()});
    };img.onerror=function(){commitDoc(d,{id:uid("doc"),type:type,name:file.name,mime:file.type,size:file.size,data:reader.result,at:new Date().toISOString()});};img.src=reader.result;};
    reader.readAsDataURL(file);
  } else {
    if(file.size>MAX){toast("File too large (max ~4 MB). Please compress it.","err");return;}
    reader.onload=function(){commitDoc(d,{id:uid("doc"),type:type,name:file.name,mime:file.type||"application/octet-stream",size:file.size,data:reader.result,at:new Date().toISOString()});};
    reader.readAsDataURL(file);
  }
}
function extFor(mime){return /pdf/.test(mime)?"pdf":/png/.test(mime)?"png":/jpeg|jpg/.test(mime)?"jpg":"bin";}
function commitDoc(d,doc){
  function fin(){var live=drById(d.id)||d;if(!live.docs)live.docs=[];live.docs.unshift(doc);persist();hideLoader();refreshDocHost(live);toast("Document saved: "+doc.type,"good");}
  if(SB_ON&&/^data:/.test(doc.data||"")){showLoader("Uploading document…");sbUpload("drivers/"+d.id+"/doc-"+doc.id+"."+extFor(doc.mime),dataURLtoBlob(doc.data),doc.mime).then(function(url){doc.data=url;fin();}).catch(function(e){hideLoader();toast("Document upload failed.","err");});}
  else fin();
}
function delDoc(d,did){var live=drById(d.id)||d;if(!live.docs)return;var i=live.docs.findIndex(function(x){return x.id===did;});if(i>=0)live.docs.splice(i,1);persist();refreshDocHost(live);toast("Document removed.","good");}
function fillRowsIfDrivers(){if(curEnt==="drivers"&&document.getElementById("tbody"))fillRows("drivers");}
/* ===== Employee assets / uniform kit ===== */
var ASSET_ITEMS=["Mobile Stand","Delivery Bag","T-shirt","Pants","Jacket","Helmet","Cap","Gloves","Shoes","Safety Kit"];
function kitIcon(item){
  if(/helmet/i.test(item))return '<path d="M4 14a8 8 0 0 1 16 0"/><path d="M2 14h20v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>';
  if(/bag/i.test(item))return '<path d="M6 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><rect x="4" y="8" width="16" height="13" rx="2"/><path d="M9 12h6"/>';
  if(/shoe/i.test(item))return '<path d="M2 17h20v2H2z"/><path d="M2 17V9l5 2 3-3 4 5h6a2 2 0 0 1 2 2"/>';
  if(/t-shirt|jacket|pants|cap|glove/i.test(item))return '<path d="M6 4l3-1 3 2 3-2 3 1 3 4-3 2v9H6v-9L3 8z"/>';
  if(/stand|mobile/i.test(item))return '<rect x="7" y="3" width="10" height="16" rx="2"/><path d="M10 21h4"/>';
  return '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>';
}
function kitFind(rec,item){return (rec.kit||[]).filter(function(x){return x.name===item;})[0];}
function toggleKitAssign(id,item){var d=drById(id);if(!d)return;if(!d.kit)d.kit=[];var i=d.kit.findIndex(function(x){return x.name===item;});
  if(i>=0)d.kit.splice(i,1);else d.kit.push({name:item,collected:false,at:isoToday()});
  persist();logAudit("edit","drivers",id,recLabel("drivers",d),[{f:"kit",l:"Assets",from:"",to:(i>=0?"unassigned: ":"assigned: ")+item}]);
  if(getRoute().indexOf("grd/drivers/"+id)===0)pageDetail($("#page"),"drivers",id);}
function toggleKitCollect(id,item){var d=drById(id);if(!d||!d.kit)return;var k=d.kit.filter(function(x){return x.name===item;})[0];if(!k)return;
  k.collected=!k.collected;if(k.collected)k.collectedAt=isoToday();else delete k.collectedAt;
  persist();if(getRoute().indexOf("grd/drivers/"+id)===0)pageDetail($("#page"),"drivers",id);}
function docsMiniCard(rec,id){
  var docs=rec.docs||[];
  var body=docs.length?'<div class="doc-mini">'+docs.map(function(dc){var img=/^image\//.test(dc.mime);
    return '<div class="dm-tile" data-act="docviewd" data-did="'+dc.id+'" data-id="'+id+'" title="'+esc(dc.type)+' — '+esc(dc.name)+'"><div class="dm-th">'+(img?'<img src="'+dc.data+'" alt="">':'<span class="dm-ic">'+FILEIC+'</span>')+'</div><div class="dm-lab">'+esc(dc.type)+'</div></div>';
  }).join("")+'</div>':'<div class="empty" style="padding:16px">'+FILEIC+'<h4 style="font-size:13px">No documents</h4></div>';
  return '<div class="card"><div class="card-h"><h3>Documents <span style="color:var(--muted);font-weight:600">('+docs.length+')</span></h3>'+(can("edit")?'<button class="btn sm" data-act="docs" data-id="'+id+'">'+svg(IC_up)+'Manage</button>':'')+'</div><div class="card-b">'+body+'</div></div>';
}
function assetsCard(rec,id){
  var assigned=(rec.kit||[]).length,coll=(rec.kit||[]).filter(function(x){return x.collected;}).length;
  var tiles=ASSET_ITEMS.map(function(item){var k=kitFind(rec,item);var on=!!k,col=k&&k.collected;
    return '<div class="kit-tile'+(on?(col?" on col":" on"):"")+'">'+
      '<button class="kit-main"'+(can("edit")?' data-act="kitassign" data-id="'+id+'" data-item="'+esc(item)+'"':' disabled')+'>'+svg(kitIcon(item))+'<span>'+esc(item)+'</span></button>'+
      (on?'<label class="kit-col"><input type="checkbox"'+(can("edit")?' data-act="kitcollect" data-id="'+id+'" data-item="'+esc(item)+'"':' disabled')+(col?" checked":"")+'>'+(col?"Collected":"Mark collected")+'</label>':'')+
    '</div>';
  }).join("");
  return '<div class="card" style="margin-top:16px"><div class="card-h"><h3>Assets &amp; Uniform</h3><span class="hint">'+assigned+' assigned · '+coll+' returned</span></div><div class="card-b"><div class="kit-grid">'+tiles+'</div></div></div>';
}
function assetReturnModal(id){
  var d=drById(id);if(!d)return;var pend=(d.kit||[]).filter(function(x){return !x.collected;});if(!pend.length)return;
  var ov=document.createElement("div");ov.className="overlay";ov.id="overlay";
  ov.innerHTML='<div class="modal" style="max-width:460px"><div class="modal-h"><div><h3>Collect assets before termination</h3><div class="sub">'+esc(d.name)+' — '+pend.length+' assigned asset(s) not yet collected</div></div><button class="icon-btn" data-act="close">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div><div class="modal-b"><div class="banner amber" style="margin-bottom:14px">'+svg('<path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>')+'<div>This employee is being terminated. Tick every asset you have collected back.</div></div>'+
    '<div class="kit-return"><label class="kr-row kr-all"><input type="checkbox" id="krAll"> <b>Select all</b></label>'+pend.map(function(k){return '<label class="kr-row"><input type="checkbox" class="kr-chk" data-item="'+esc(k.name)+'"> '+esc(k.name)+'</label>';}).join("")+'</div></div>'+
    '<div class="modal-f"><button class="btn ghost" data-act="close">Later</button><button class="btn primary" data-act="kitreturnsave" data-id="'+id+'">'+svg('<path d="M20 6 9 17l-5-5"/>')+'Mark collected</button></div></div>';
  document.body.appendChild(ov);
  var all=ov.querySelector("#krAll");if(all)all.addEventListener("change",function(){ov.querySelectorAll(".kr-chk").forEach(function(c){c.checked=all.checked;});});
}
function saveKitReturn(id){var d=drById(id);if(!d)return;var ov=$("#overlay");var n=0;
  if(ov)$$(".kr-chk",ov).forEach(function(c){if(c.checked){var k=(d.kit||[]).filter(function(x){return x.name===c.getAttribute("data-item");})[0];if(k&&!k.collected){k.collected=true;k.collectedAt=isoToday();n++;}}});
  if(n)logAudit("edit","drivers",id,recLabel("drivers",d),[{f:"kit",l:"Assets",from:"",to:"collected "+n+" asset(s) on termination"}]);
  persist();closeForm();if(getRoute().indexOf("grd/drivers/"+id)===0)pageDetail($("#page"),"drivers",id);else renderApp();
  toast(n?("Marked "+n+" asset(s) collected."):"No assets marked.","good");}
function viewDoc(d,did){
  var dc=(d.docs||[]).filter(function(x){return x.id===did;})[0];if(!dc)return;
  var inner=/^image\//.test(dc.mime)?'<img src="'+dc.data+'" style="max-width:100%;border-radius:8px">':'<iframe src="'+dc.data+'" style="width:100%;height:70vh;border:0;border-radius:8px;background:#fff"></iframe>';

document.addEventListener("click",function(e){
  var a=e.target.closest("[data-act]");if(!a)return;var act=a.getAttribute("data-act");

function crumbFor(ent){return ent==="expenses"?"Finance · Expense Log":ent==="payroll"?"Finance · Payroll":ent==="income"?"Finance · Income":ent==="funds"?"Finance · Company Wallet":"GRD Operations · "+ENT[ent].title;}
function detailSubtitle(ent,r){
  if(ent==="drivers")return [r.nat,r.veh,r.site,cap(r.status)].filter(Boolean).join(" · ");
  if(ent==="vehicles")return [r.brand,r.model,r.plate].filter(Boolean).join(" · ");
  if(ent==="fuel")return [r.vehType,r.company,r.site].filter(Boolean).join(" · ");
  if(ent==="sims")return [r.name,r.company].filter(Boolean).join(" · ");
  if(ent==="housing")return "Capacity "+(r.cap||0)+" · Occupied "+(r.actual||0);
  if(ent==="hiring")return [r.nat,r.veh,cap(r.status),r.reference].filter(Boolean).join(" · ");
  if(ent==="compdocs")return [r.doc,r.plate,r.user].filter(Boolean).join(" · ");
  if(ent==="service")return [r.plate,r.user].filter(Boolean).join(" · ");
  if(ent==="expenses")return [fmtD(r.date),r.platform,r.payment].filter(Boolean).join(" · ");
  return "";
}
function detailVal(ent,f,rec){
  var v=rec[f.k];
  if(f.t==="file"){if(v&&typeof v==="object"&&(v.url||v.data))return '<a href="'+esc(v.url||v.data)+'" target="_blank" rel="noopener" class="doclink">'+svg('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>')+esc(v.name||"Document")+'</a>';return '<span style="color:var(--muted)">—</span>';}
  if(v==null||String(v).trim()==="")return '<span style="color:var(--muted)">—</span>';
  if(f.k==="status")return pill(cap(v),statusClass(v));
  if(typeof v==="string"&&/^(DONE|PENDING|CANCEL|PASS|FAIL|N\/A)$/i.test(v.trim()))return pill(v.trim().toUpperCase()==="N/A"?"N/A":cap(v),statusClass(v));
  if(/Exp$/.test(f.k)||f.k==="expiry")return expCell(v);
  if(f.t==="date"||f.k==="doi"||f.k==="simIssue")return '<span class="mono">'+esc(fmtD(v))+'</span>';
  if(f.k==="amount"||f.k==="cost"||/^(basic|allowance|advance|otherDed)$/.test(f.k)||f.k==="fines"&&ent==="payroll")return '<span class="mono" style="color:var(--amber-2);font-weight:600">'+money(num(v))+' KWD</span>';
  if(/^odo$|lastService$|^interval$/.test(f.k))return '<span class="mono">'+fmtKm(v)+' km</span>';
  if(/civilId|^civil$|mobile|card|passport|account|chassis|talabat|keeta|simSerial|mbSerial|plate|salary|no|recharge|avail|bal|cap|actual/.test(f.k))return '<span class="mono">'+esc(v)+'</span>';
  return esc(v);
}
function pageDetail(pg,ent,id){

  if(!rec){go(ent==="expenses"?"finance/log":"grd/"+ent);return;}

  var primary=(rec.name||rec.nameEn||rec.plate||rec.room||rec.card||rec.mobile||((rec.category||"")+(rec.amount?" · "+money(num(rec.amount))+" KWD":""))||cfg.singular);

    (ASSETENTS[ent]&&can("edit")?'<button class="btn sm" data-act="handover" data-ent="'+ent+'" data-id="'+id+'">'+svg(IC_hand)+'Handover</button>':'')+
    (ent==="payroll"?'<button class="btn sm" data-act="payslip" data-id="'+id+'">'+svg(IC_pdf)+'Payslip PDF</button>':'<button class="btn sm" data-act="entrypdf" data-ent="'+ent+'" data-id="'+id+'">'+svg(IC_pdf)+'PDF</button>')+
    (can("edit")?'<button class="btn sm" data-act="edit" data-id="'+id+'">'+svg(IC_edit)+'Edit</button>':'')+
    (can("delete")?'<button class="btn sm danger" data-act="del" data-id="'+id+'">'+svg(IC_del)+'Delete</button>':'')+'</div>';
  html+='<div class="detail2">'+
    '<div style="display:grid;gap:16px"><div class="pvc">'+previewInner(ent,cfg,rec,"detail",id)+'</div>'+(ent==="drivers"?docsMiniCard(rec,id):"")+'</div>'+
    '<div class="groups">'+groups.map(function(gr){return '<div class="card"><div class="card-h"><h3>'+esc(gr.g)+'</h3></div><div class="card-b">'+
      gr.items.map(function(f){return '<div class="kv-row"><div class="kk">'+esc(f.l)+'</div><div class="vv">'+detailVal(ent,f,rec)+'</div></div>';}).join("")+
      '</div></div>';}).join("")+'</div>'+
  '</div>';
  if(ASSETENTS[ent])html+=assetHistoryCard(ent,rec,id);

  if(ent==="fuel")html+=fuelCard(rec,id);

  if(ent==="housing")html+=houseAssetsCard(rec,id);

    html+=assetsCard(rec,id);
  }

    var rc=rec.receipt;
    html+='<div class="card" style="margin-top:16px"><div class="card-h"><h3>Receipt</h3>'+(can("edit")?(rc?'<button class="btn sm danger" data-act="rcpdelD" data-id="'+id+'">'+svg(IC_del)+'Remove</button>':'<button class="btn sm" data-act="rcppickD" data-id="'+id+'">'+svg(IC_up)+'Attach receipt</button>'):'')+'</div><div class="card-b" style="text-align:center">'+
      (rc?(/^data:image\//.test(rc)?'<img src="'+rc+'" data-act="rcpviewD" data-id="'+id+'" style="max-height:300px;max-width:100%;border-radius:10px;cursor:zoom-in">':'<button class="btn" data-act="rcpviewD" data-id="'+id+'">'+svg(IC_eye)+'Open receipt (PDF)</button>')

function expById(id){return STATE.finance.expenses.filter(function(x){return x.id===id;})[0];}
function pickReceipt(id){
  if(READONLY){toast("You have view-only access.","err");return;}
  var rec=expById(id);if(!rec)return;
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*,application/pdf";
  inp.onchange=function(){if(inp.files&&inp.files[0])readReceipt(inp.files[0],function(data){
    if(SB_ON){var bl=dataURLtoBlob(data);toast("Uploading receipt…","good");sbUpload("expenses/"+id+"/receipt."+extFor(bl.type),bl,bl.type).then(function(url){rec.receipt=url;persist();pageDetail($("#page"),"expenses",id);toast("Receipt attached.","good");}).catch(function(e){toast("Receipt upload failed.","err");});}
    else{rec.receipt=data;persist();pageDetail($("#page"),"expenses",id);toast("Receipt attached.","good");}
  });};
  inp.click();
}
function pickPhoto(id){
  if(READONLY){toast("You have view-only access.","err");return;}
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(){if(inp.files&&inp.files[0])savePhoto(id,inp.files[0]);};
  inp.click();
}
function savePhoto(id,file){
  var rec=drById(id);if(!rec)return;
  var reader=new FileReader();
  reader.onload=function(){var img=new Image();
    img.onload=function(){
      var mx=560,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var cw=Math.max(1,Math.round(img.width*sc)),ch=Math.max(1,Math.round(img.height*sc));
      var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;cv.getContext("2d").drawImage(img,0,0,cw,ch);
      var data;try{data=cv.toDataURL("image/jpeg",0.85);}catch(e){data=reader.result;}
      if(SB_ON){toast("Uploading photo…","good");sbUpload("drivers/"+id+"/photo.jpg",dataURLtoBlob(data),"image/jpeg").then(function(url){rec.photo=url;persist();pageDetail($("#page"),curEnt,id);toast("Photo updated.","good");}).catch(function(e){toast("Photo upload failed.","err");});}
      else{rec.photo=data;persist();pageDetail($("#page"),curEnt,id);toast("Photo updated.","good");}
    };
    img.onerror=function(){toast("Couldn't read that image.","err");};img.src=reader.result;};
  reader.readAsDataURL(file);
}

/* ---- jsPDF helpers ---- */
function pdfNew(){var J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast("PDF engine not available here.","err");return null;}return new J({unit:"pt",format:"a4"});}
function pdfHead(doc,title,sub){
  var W=doc.internal.pageSize.getWidth();
  doc.setFillColor(16,185,129);doc.rect(0,0,W,7,"F");
  doc.setTextColor(17,24,39);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("SMOU International",40,52);
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(120,120,120);doc.text("Fleet Management",40,68);
  doc.setDrawColor(224,224,224);doc.line(40,82,W-40,82);
  doc.setTextColor(17,24,39);doc.setFont("helvetica","bold");doc.setFontSize(14);doc.text(String(title||""),40,108);
  var y=118;
  if(sub){doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(110,110,110);doc.text(String(sub),40,124);y=138;}
  return y;
}
function pdfSection(doc,y,label){
  var W=doc.internal.pageSize.getWidth();if(y>770){doc.addPage();y=60;}
  y+=14;doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.setTextColor(16,140,110);doc.text(String(label).toUpperCase(),40,y);
  doc.setDrawColor(232,232,232);doc.line(40,y+6,W-40,y+6);return y+18;
}
function pdfKV(doc,y,rows){
  var W=doc.internal.pageSize.getWidth(),lx=40,vx=205;
  rows.forEach(function(r){
    if(y>790){doc.addPage();y=60;}
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.setTextColor(115,115,115);doc.text(String(r[0]),lx,y);
    doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(25,25,25);
    var val=(r[1]==null||r[1]==="")?"—":String(r[1]);
    var lines=doc.splitTextToSize(val,W-vx-40);doc.text(lines,vx,y);
    y+=Math.max(17,lines.length*13.5);
  });
  return y;
}
function pdfFoot(doc){
  for(var i=1;i<=doc.internal.getNumberOfPages();i++){doc.setPage(i);
    var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
    doc.setDrawColor(232,232,232);doc.line(40,H-42,W-40,H-42);
    doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(155,155,155);
    doc.text("Generated "+new Date().toLocaleString()+"  ·  SMOU Fleet ERP",40,H-28);
    doc.text("Page "+i+" / "+doc.internal.getNumberOfPages(),W-40,H-28,{align:"right"});
  }
}
function pdfDate(f,v){return (f&&(f.t==="date"||/Exp$|Issue$|Return$|^doi$|^date$/.test(f.k)))?fmtD(v):v;}

/* ---- per-entry record PDF ---- */
function entryPDF(ent,id){
  var doc=pdfNew();if(!doc)return;var cfg=ENT[ent];var rec=recById(ent,id);if(!rec)return;
  var primary=(rec.name||rec.nameEn||rec.plate||rec.room||rec.card||rec.mobile||((rec.category||"")+(rec.amount?" "+money(num(rec.amount))+" KWD":""))||cfg.singular);
  var y=pdfHead(doc,cfg.singular+" Record",primary);
  var groups=[],cur=null;
  cfg.fields.forEach(function(f){if(f.g){cur={g:f.g,items:[]};groups.push(cur);}else{if(!cur){cur={g:"Details",items:[]};groups.push(cur);}cur.items.push(f);}});
  groups.forEach(function(gr){
    var rows=gr.items.filter(function(f){var v=rec[f.k];return v!=null&&String(v).trim()!=="";}).map(function(f){return [f.l,pdfDate(f,rec[f.k])];});
    if(!rows.length)return;y=pdfSection(doc,y,gr.g);y=pdfKV(doc,y,rows);
  });
  if(ent==="housing"&&rec.assets&&rec.assets.length){y=pdfSection(doc,y,"Room Assets");y=pdfKV(doc,y,rec.assets.map(function(a){return [a.type,"x "+(num(a.count)||0)];}));}
  if(rec.assign&&rec.assign.length){y=pdfSection(doc,y,"Assignment / Handover History");
    y=pdfKV(doc,y,rec.assign.map(function(h){return [fmtD(h.date)+(h.ret?" → "+fmtD(h.ret):""),h.to+(h.from?" (from "+h.from+")":"")+(h.reason?" — "+h.reason:"")];}));}
  pdfFoot(doc);
  doc.save(slug(cfg.singular+"_"+primary)+".pdf");
  toast("PDF downloaded.","good");
}

var fuelTrackPeriod="month";
function ftInRange(d,s,e){return !!d&&(!s||d>=s)&&(!e||d<=e);}
function ftRange(k){
  var n=TODAY,y=n.getFullYear(),m=n.getMonth();
  if(k==="month")return {start:new Date(y,m,1),end:null,prevStart:new Date(y,m-1,1),prevEnd:new Date(y,m,0),label:MON[m]+" "+y};
  if(k==="last")return {start:new Date(y,m-1,1),end:new Date(y,m,0),prevStart:new Date(y,m-2,1),prevEnd:new Date(y,m-1,0),label:MON[(m+11)%12]+" "+(m===0?y-1:y)};
  if(k==="q")return {start:new Date(y,m-2,1),end:null,prevStart:new Date(y,m-5,1),prevEnd:new Date(y,m-2,0),label:"Last 3 months"};
  return {start:null,end:null,prevStart:null,prevEnd:null,label:"All time"};
}
function ftAgg(start,end){
  var km={},fuel={},lit={},cnt={};
  (STATE.grd.service||[]).forEach(function(s){var p=String(s.plate||"").trim();if(!p)return;(s.kmlog||[]).forEach(function(l){if(ftInRange(parseD(l.date),start,end))km[p]=(km[p]||0)+(num(l.km)||0);});});
  (STATE.grd.fuel||[]).forEach(function(c){(c.fills||[]).forEach(function(x){if((x.type||"Fill")!=="Fill")return;var p=String(x.plate||c.plate||"").trim();if(!p)return;if(ftInRange(parseD(x.date),start,end)){fuel[p]=(fuel[p]||0)+(num(x.amount)||0);lit[p]=(lit[p]||0)+(num(x.liters)||0);cnt[p]=(cnt[p]||0)+1;}});});
  return {km:km,fuel:fuel,lit:lit,cnt:cnt};
}
function pageFuelTracker(pg){
  var R=ftRange(fuelTrackPeriod);var A=ftAgg(R.start,R.end);var P=ftAgg(R.prevStart,R.prevEnd);
  var plates={};Object.keys(A.km).forEach(function(p){plates[p]=1;});Object.keys(A.fuel).forEach(function(p){plates[p]=1;});
  var rows=Object.keys(plates).map(function(p){
    var km=A.km[p]||0,fu=A.fuel[p]||0,li=A.lit[p]||0;
    var v=vehByPlate(p);
    return {plate:p,km:km,fuel:fu,lit:li,cpk:(km>0?fu/km:null),kpl:(li>0?km/li:null),driver:(v&&v.driver)||"",veh:(v&&(v.vehType||v.brand))||""};
  });
  var totKm=rows.reduce(function(a,r){return a+r.km;},0);
  var totFuel=rows.reduce(function(a,r){return a+r.fuel;},0);
  var fleetCpk=totKm>0?totFuel/totKm:null;
  // previous-period fleet cost/km for the trend delta
  var pKm=0,pFuel=0;Object.keys(P.km).forEach(function(p){pKm+=P.km[p];});Object.keys(P.fuel).forEach(function(p){pFuel+=P.fuel[p];});
  var prevCpk=pKm>0?pFuel/pKm:null;
  var delta=(fleetCpk!=null&&prevCpk!=null&&prevCpk>0)?((fleetCpk-prevCpk)/prevCpk*100):null;
  // rankable = both km & fuel present; else data gap
  var rankable=rows.filter(function(r){return r.cpk!=null;}).sort(function(a,b){return b.cpk-a.cpk;});
  var noKm=rows.filter(function(r){return r.fuel>0&&r.km<=0;});
  var noFuel=rows.filter(function(r){return r.km>0&&r.fuel<=0;});
  var maxCpk=rankable.length?rankable[0].cpk:0;
  var top=rankable[0];
  // period tabs
  var tabs='<div class="sub-tabs" style="margin-bottom:16px">'+[["month","This month"],["last","Last month"],["q","Last 3 months"],["all","All time"]].map(function(t){return '<button class="sub-tab'+(fuelTrackPeriod===t[0]?" active":"")+'" data-act="ftperiod" data-p="'+t[0]+'">'+t[1]+'</button>';}).join("")+'</div>';
  // KPI cards
  function kpi(lab,val,sub,col){return '<div class="stat card"><span class="strip" style="background:'+(col||"var(--teal)")+'"></span><div class="s-lab">'+lab+'</div><div class="s-val">'+val+'</div><div class="s-sub">'+(sub||"&nbsp;")+'</div></div>';}
  var deltaTxt=delta==null?"vs last period: —":((delta>=0?"▲ ":"▼ ")+Math.abs(delta).toFixed(0)+"% vs last period");
  var deltaCol=delta==null?"var(--muted)":(delta>0?"var(--crit)":"var(--good)");
  var kpis='<div class="stat-grid" style="margin-bottom:16px">'+
    kpi("Fleet Distance",fmtKm(totKm)+" km",R.label,"var(--teal)")+
    kpi("Fuel Spend",money(totFuel)+" KWD",R.label,"var(--amber)")+
    kpi("Fleet Cost / km",fleetCpk!=null?fleetCpk.toFixed(3)+" KWD":"—","<span style='color:"+deltaCol+"'>"+deltaTxt+"</span>","var(--indigo)")+
    kpi("Top Consumer",top?esc(top.plate):"—",top?top.cpk.toFixed(3)+" KWD/km":"need km + fuel","var(--crit)")+
  '</div>';
  // ranked list
  var list='<div class="card"><div class="card-h"><h3>Consumption by Vehicle</h3><span class="hint">worst first · cost per km</span></div><div class="card-b">'+
    (rankable.length?rankable.map(function(r,i){
      var w=maxCpk>0?Math.max(5,Math.round(r.cpk/maxCpk*100)):0;
      var col=i===0?"var(--crit)":i<3?"var(--amber)":"var(--teal)";
      return '<div class="ft-row"><span class="ft-rank">'+(i+1)+'</span>'+
        '<div class="ft-main"><div class="ft-plate">'+esc(r.plate)+(r.veh?' <span class="ft-veh">'+esc(r.veh)+'</span>':'')+(r.driver?' <span class="ft-veh">· '+esc(r.driver)+'</span>':'')+'</div>'+
        '<div class="ft-bar"><span style="width:'+w+'%;background:'+col+'"></span></div>'+
        '<div class="ft-sub">'+fmtKm(r.km)+' km · '+money(r.fuel)+' KWD'+(r.kpl!=null?' · '+r.kpl.toFixed(1)+' km/L':'')+'</div></div>'+
        '<div class="ft-cpk"><b style="color:'+col+'">'+r.cpk.toFixed(3)+'</b><span>KWD/km</span></div></div>';
    }).join(""):'<div class="empty" style="padding:26px">'+svg('<path d="M3 3v18h18M7 14l3-3 3 2 4-5"/>')+'<h4>Not enough data yet</h4><p>Add daily KM in Vehicle Service and daily fuel in Fuel Cards — a vehicle needs both (with a matching plate) to rank here.</p></div>')+
  '</div></div>';
  // data-gap alerts
  var gaps="";
  if(noKm.length||noFuel.length){
    gaps='<div class="card" style="margin-top:16px"><div class="card-h"><h3>⚠️ Data Gaps</h3><span class="hint">fix these for accurate cost/km</span></div><div class="card-b">'+
      (noKm.length?'<div style="margin-bottom:8px"><b style="font-size:13px">Fuel logged but no KM ('+noKm.length+'):</b> <span style="color:var(--muted);font-size:12.5px">'+noKm.map(function(r){return esc(r.plate);}).join(", ")+'</span><div class="sub" style="font-size:11.5px;color:var(--muted)">Add daily KM for these in Vehicle Service.</div></div>':'')+
      (noFuel.length?'<div><b style="font-size:13px">KM logged but no fuel ('+noFuel.length+'):</b> <span style="color:var(--muted);font-size:12.5px">'+noFuel.map(function(r){return esc(r.plate);}).join(", ")+'</span><div class="sub" style="font-size:11.5px;color:var(--muted)">Add fuel fills for these in Fuel Cards (with the matching plate).</div></div>':'')+
    '</div></div>';
  }
  var help='<div class="banner info" style="margin-top:16px">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+'<div style="font-size:12.5px">Cost/km = fuel spent ÷ km driven for each vehicle (matched by plate). Lower is better. Log daily KM in <b>Vehicle Service</b> and daily fuel in <b>Fuel Cards</b> — the tracker updates automatically.</div></div>';
  pg.innerHTML=tabs+kpis+list+gaps+help;
  if(LANG==="ar")transEl(pg);
}

function importSheet(ent,arraybuffer){
  if(!can("edit")){toast("You don't have permission to import.","err");return;}
  if(!xlsxReady()){toast("Excel engine still loading — try again in a moment.","err");return;}
  var aoa;
  try{var wb=XLSX.read(new Uint8Array(arraybuffer),{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",blankrows:false});}
  catch(e){toast("Couldn't read that file. Use an Excel (.xlsx) or CSV file.","err");return;}
  if(!aoa||aoa.length<2){toast("No data rows found in the file.","err");return;}
  var fs=regFields(ent),cfg=ENT[ent];
  var header=aoa[0].map(function(h){return String(h==null?"":h).trim().toLowerCase();});
  var map=header.map(function(h){
    if(h==="reference id"||h==="ref id"||h==="reference"||h==="refid"||h==="id")return "__refid__";
    var f=fs.filter(function(x){return x.l.toLowerCase()===h||x.k.toLowerCase()===h;})[0];return f?f.k:null;});
  if(!map.some(function(x){return x&&x!=="__refid__";})){toast("Columns didn't match. Use the blank template's headings.","err");return;}
  var added=0,updated=0;
  for(var i=1;i<aoa.length;i++){var r=aoa[i],rec={},any=false,refid="";
    for(var j=0;j<r.length;j++){var k=map[j];if(!k)continue;var v=r[j]==null?"":(typeof r[j]==="number"?String(r[j]):String(r[j]).trim());
      if(k==="__refid__"){refid=v;continue;}rec[k]=v;if(v)any=true;}
    if(!any&&!refid)continue;
    if(refid){var ex=store(ent).filter(function(x){return x.id===refid;})[0];
      if(ex){if(!any)continue;var chg=diffRec(cfg,ex,rec);Object.assign(ex,rec);logAudit("edit",ent,ex.id,recLabel(ent,ex),chg);updated++;continue;}
      // reference id given but not found → create WITH that id so it stays stable for future imports
      if(!any)continue;rec.id=refid;store(ent).unshift(rec);logAudit("add",ent,rec.id,recLabel(ent,rec),[]);added++;continue;}
    rec.id=uid(cfg.idp);store(ent).unshift(rec);logAudit("add",ent,rec.id,recLabel(ent,rec),[]);added++;}
  if(!added&&!updated){toast("Nothing to import.","err");return;}
  persist();renderApp();
  toast("Import done — "+added+" new"+(updated?", "+updated+" updated":"")+" in "+ENT[ent].title+".","good");
}

function ccLoad(force){
  if(!ccIsAdmin())return Promise.resolve();
  if(CC.loading||(CC.loaded&&!force))return Promise.resolve();
  CC.loading=true;
  return Promise.all([
    SB.from("drivers").select("*").order("created_at"),

function ccApply(table,ev,nw,old){

  if(!nw)return;var j=arr.findIndex(function(x){return String(x.id)===String(nw.id);});

function ccLiveList(){

function ccFeed(){

    if(s.status==="ACTIVE")ev.push({t:ccMs(s),c:"good",h:'<b>'+n+'</b> clocked in · '+esc(s.login_place||"—"),m:'ODO '+fmtKm(s.start_odo)+(s.login_src==="hub"?' · hub picked, not GPS':'')});
    else ev.push({t:ccMs(s),c:"indigo",h:'<b>'+n+'</b> clocked out · +'+(s.distance||0)+' km',m:(s.orders_done||0)+' orders · '+(s.orders_cancelled||0)+' cancelled · '+esc(s.duration||"")});});
  CC.fuel.slice(0,30).forEach(function(f){var d=ccDrv(f.driver_id);ev.push({t:Date.parse(f.created_at)||0,c:"warn",h:'<b>'+esc((d&&d.name)||"Driver")+'</b> logged fuel · '+money(f.cost)+' KWD',m:esc(f.station||"")+(f.receipt_photo?' · receipt attached':'')});});
  ev.sort(function(a,b){return b.t-a.t;});ev=ev.slice(0,8);

}
function ccTop(){
  var td=ccToday(),m={};

  var arr=Object.keys(m).map(function(id){return {d:ccDrv(id),km:m[id].km,ord:m[id].ord};}).sort(function(a,b){return b.km-a.km;}).slice(0,5);
  if(!arr.length)return '<div class="empty" style="padding:18px"><p>No completed shifts today yet.</p></div>';
  var mx=arr[0].km||1;
  return arr.map(function(x,i){return '<div class="cc-top"><span class="ft-rank">'+(i+1)+'</span><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between"><span class="nm">'+esc(x.d?x.d.name:"—")+'</span><b class="mono">'+fmtKm(x.km)+' km</b></div><div class="ft-bar"><span style="width:'+Math.max(4,Math.round(x.km/mx*100))+'%;background:var(--teal)"></span></div><div class="sub">'+x.ord+' orders</div></div></div>';}).join("");
}
function ccWeek(){
  var days=[];for(var i=6;i>=0;i--){var d=ccDay(i);days.push({d:d,km:ccKmDay(d)});}
  var mx=Math.max.apply(null,days.map(function(x){return x.km;}).concat([1]));
  return '<div class="cc-week">'+days.map(function(x){var dt=parseD(x.d);var lab=dt?["Su","Mo","Tu","We","Th","Fr","Sa"][dt.getDay()]:"";
    return '<div class="cc-wcol" title="'+x.d+': '+x.km+' km"><span class="cc-wv">'+(x.km?fmtKm(x.km):"")+'</span><span class="cc-wbar" style="height:'+Math.max(3,Math.round(x.km/mx*110))+'px"></span><span class="sub">'+lab+'</span></div>';}).join("")+'</div>';
}
function ccAlerts(){
  var out=[];
  ccDone().filter(ccFlag).slice(0,4).forEach(function(s){var d=ccDrv(s.driver_id);out.push(['crit','Odometer check · '+esc(d?d.name:"Driver"),fmtD(s.date)+' · shift shows '+(s.distance||0)+' km (limit '+CC_KM_FLAG+'). Check the end-ODO photo.']);});
  ccActive().filter(function(s){return Date.now()-ccMs(s)>14*3600000;}).forEach(function(s){var d=ccDrv(s.driver_id);out.push(['warn','Shift open 14h+ · '+esc(d?d.name:"Driver"),'Clocked in '+ccAgo(ccMs(s))+'. Probably forgot to clock out — use End shift.']);});
  CC.shifts.filter(function(s){return s.date===ccToday()&&(s.login_src==="hub"||s.logout_src==="hub");}).slice(0,3).forEach(function(s){var d=ccDrv(s.driver_id);out.push(['warn','Hub picked, not GPS · '+esc(d?d.name:"Driver"),'Check-in/out location was chosen from the hub list.']);});
  CC.drivers.forEach(function(d){var n=ccDone().filter(function(s){return String(s.driver_id)===String(d.id);}).length;var f=CC.fuel.filter(function(x){return String(x.driver_id)===String(d.id);}).length;if(n>=3&&!f)out.push(['neutral','No fuel logged · '+esc(d.name),n+' shifts, zero fuel entries.']);});
  CC.drivers.filter(function(d){return !d.employee_id;}).forEach(function(d){out.push(['neutral','Not linked to an employee · '+esc(d.name),'Phone '+esc(d.phone||"—")+' doesn’t match any employee mobile. Edit the driver to link.']);});
  if(!out.length)return '<div class="empty" style="padding:18px"><p>All clear — nothing flagged.</p></div>';
  return out.slice(0,8).map(function(a){return '<div class="cc-alert"><span class="pill '+a[0]+'"><span class="pd"></span>'+(a[0]==="crit"?"Check":a[0]==="warn"?"Review":"Info")+'</span><div><div style="font-size:13px;font-weight:700">'+a[1]+'</div><div class="sub">'+a[2]+'</div></div></div>';}).join("");
}
/* map */
function ccPin(kind){return window.L.divIcon({className:"",html:'<div class="cc-pin '+kind+'">'+(kind==="in"?"↓":"↑")+'</div>',iconSize:[26,26],iconAnchor:[13,24]});}
function ccLiveIcon(name,stale){return window.L.divIcon({className:"",html:'<div class="cc-dot'+(stale?" stale":"")+'"></div><div class="cc-label">'+esc(String(name||"Driver").split(" ")[0])+'</div>',iconSize:[22,22],iconAnchor:[11,11]});}
function ccTeardown(){if(CC.map){try{CC.view={c:CC.map.getCenter(),z:CC.map.getZoom()};CC.map.remove();}catch(e){}}CC.map=null;CC.markers={};CC.trails={};}
function ccMountMap(){
  var el=document.getElementById("ccmap");if(!el)return;
  if(typeof window.L==="undefined"||!window.L.map){el.innerHTML='<div class="empty"><p>Map library is loading… check the internet connection.</p></div>';return;}
  if(CC.map){try{CC.view={c:CC.map.getCenter(),z:CC.map.getZoom()};CC.map.remove();}catch(e){}CC.map=null;CC.markers={};CC.trails={};}
  var m=window.L.map(el,{scrollWheelZoom:true}).setView([29.32,47.98],11);CC.map=m;
  window.L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri"}).addTo(m);
  var b=[],td=ccToday();
  CC.shifts.filter(ccPass).filter(function(s){return s.date===td;}).forEach(function(s){var d=ccDrv(s.driver_id),n=esc((d&&d.name)||"Driver");
    if(s.login_lat!=null){window.L.marker([s.login_lat,s.login_lng],{icon:ccPin("in")}).addTo(m).bindPopup('<b>'+n+' · login</b><br>'+esc(s.login_place||"")+'<br>'+esc(s.login_time||""));b.push([s.login_lat,s.login_lng]);}
    if(s.logout_lat!=null){window.L.marker([s.logout_lat,s.logout_lng],{icon:ccPin("out")}).addTo(m).bindPopup('<b>'+n+' · logout</b><br>'+esc(s.logout_place||"")+'<br>'+esc(s.logout_time||""));b.push([s.logout_lat,s.logout_lng]);}
  });
  ccActive().filter(ccPass).forEach(function(s){ccAddMarker(s);var la=s.live_lat!=null?s.live_lat:s.login_lat;if(la!=null)b.push([la,s.live_lng!=null?s.live_lng:s.login_lng]);});
  if(CC.view)m.setView(CC.view.c,CC.view.z,{animate:false});else if(b.length)m.fitBounds(b,{padding:[40,40],maxZoom:15});
  m.on("dragstart",function(){if(CC.follow){CC.follow=null;ccRefreshLive();}});
  m.on("moveend",function(){if(CC.map)CC.view={c:CC.map.getCenter(),z:CC.map.getZoom()};});
  ccLoadTrails();
  setTimeout(function(){if(CC.map)CC.map.invalidateSize();},80);
}
function ccAddMarker(s){
  if(!CC.map)return;var la=s.live_lat!=null?s.live_lat:s.login_lat,ln=s.live_lng!=null?s.live_lng:s.login_lng;if(la==null)return;
  var d=ccDrv(s.driver_id),st=ccStale(s);
  var mk=window.L.marker([la,ln],{icon:ccLiveIcon(d&&d.name,st),zIndexOffset:1000}).addTo(CC.map)
    .bindPopup(function(){var x=CC.shifts.filter(function(y){return String(y.id)===String(s.id);})[0]||s;return '<b>'+esc((d&&d.name)||"Driver")+'</b><br>'+esc(x.platform||"")+' · '+(x.speed||0)+' km/h<br>updated '+ccAgo(ccLiveMs(x));});
  mk._stale=st;CC.markers[s.id]=mk;
}
function ccLoadTrails(){
  var ids=ccActive().map(function(s){return String(s.id);});if(!ids.length||!CC.map)return;
  SB.from("shift_points").select("shift_id,lat,lng,recorded_at").in("shift_id",ids).order("recorded_at",{ascending:true}).limit(10000).then(function(r){
    if(r.error||!r.data||!CC.map)return;var by={};
    r.data.forEach(function(p){(by[p.shift_id]=by[p.shift_id]||[]).push([p.lat,p.lng]);});
    Object.keys(by).forEach(function(sid){var ll=by[sid];var s=CC.shifts.filter(function(x){return String(x.id)===sid;})[0];if(s&&s.live_lat!=null)ll.push([s.live_lat,s.live_lng]);
      if(CC.trails[sid])CC.trails[sid].setLatLngs(ll);else CC.trails[sid]=window.L.polyline(ll,{color:"#E3A64A",weight:4,opacity:.85,lineJoin:"round"}).addTo(CC.map);});
  });
}
function ccTrailPoint(sid,lat,lng){sid=String(sid);if(!CC.map||lat==null)return;
  if(CC.trails[sid])CC.trails[sid].addLatLng([lat,lng]);else CC.trails[sid]=window.L.polyline([[lat,lng]],{color:"#E3A64A",weight:4,opacity:.85,lineJoin:"round"}).addTo(CC.map);}
function ccAnimate(mk,to){var from=mk.getLatLng();if(Math.abs(from.lat-to[0])<1e-7&&Math.abs(from.lng-to[1])<1e-7)return;
  if(mk._anim)cancelAnimationFrame(mk._anim);var t0=performance.now();
  var step=function(t){var k=Math.min(1,(t-t0)/900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;mk.setLatLng([from.lat+(to[0]-from.lat)*e,from.lng+(to[1]-from.lng)*e]);mk._anim=k<1?requestAnimationFrame(step):null;};
  mk._anim=requestAnimationFrame(step);}
function ccMove(id){
  var s=CC.shifts.filter(function(x){return String(x.id)===String(id);})[0];if(!s)return;
  if(CC.map&&s.status==="ACTIVE"&&ccPass(s)){
    var mk=CC.markers[s.id];
    if(!mk)ccAddMarker(s);
    else if(s.live_lat!=null){ccAnimate(mk,[s.live_lat,s.live_lng]);var st=ccStale(s);if(st!==mk._stale){mk.setIcon(ccLiveIcon((ccDrv(s.driver_id)||{}).name,st));mk._stale=st;}}
    if(String(CC.follow)===String(s.id)&&s.live_lat!=null)CC.map.panTo([s.live_lat,s.live_lng],{animate:true,duration:.8});
  }
  ccRefreshLive();
}
var _ccLT=null;function ccRefreshLive(){if(_ccLT)return;_ccLT=setTimeout(function(){_ccLT=null;var el=document.getElementById("ccLive");if(el)el.innerHTML=ccLiveList();},400);}
function ccFollow(id){
  CC.follow=String(CC.follow)===String(id)?null:id;ccRefreshLive();
  if(!CC.follow||!CC.map)return;var s=CC.shifts.filter(function(x){return String(x.id)===String(id);})[0];
  if(s){var la=s.live_lat!=null?s.live_lat:s.login_lat;if(la!=null)CC.map.flyTo([la,s.live_lng!=null?s.live_lng:s.login_lng],16,{duration:.8});}
}
function ccForceEnd(id){
  var s=CC.shifts.filter(function(x){return String(x.id)===String(id);})[0];if(!s)return;var d=ccDrv(s.driver_id);
  if(!confirm("End "+((d&&d.name)||"this driver")+"'s shift now? Distance will be saved as 0 km — correct the odometer later if needed."))return;

  SB.from("shifts").update({status:"COMPLETED",end_odo:s.start_odo,distance:0,logout_time:now,logout_place:"Force-closed by admin",duration:Math.floor(mins/60)+"h "+(mins%60)+"m",summary:"Force-closed by admin (driver did not clock out)"}).eq("id",s.id).select().then(function(r){

  });

  var tb=rows.length?rows.map(function(d){var e=ccEmp(d),on=!!ccActiveFor(d.id);
    var km=ccDone().filter(function(s){return String(s.driver_id)===String(d.id);}).reduce(function(a,s){return a+(s.distance||0);},0);
    return '<tr><td>'+ccDrvCell(d)+'</td><td>'+(e?'<a class="chip" data-route="grd/drivers/'+esc(e.id)+'" href="#">↔ '+esc(e.name)+'</a>':'<span class="pill warn">Not linked</span>')+'</td>'+

      '<td>'+(d.active_device?'<span class="pill indigo">Phone linked</span>':'<span class="sub">no device</span>')+(d.locked_until&&Date.parse(d.locked_until)>Date.now()?' <span class="pill crit">Locked</span>':'')+'</td>'+
      '<td class="mono"><button class="chip" data-act="ccpin" data-id="'+d.id+'" title="Show PIN">••••</button></td><td class="mono">'+fmtKm(km)+' km</td>'+
      '<td style="white-space:nowrap"><button class="btn sm" data-act="ccedit" data-id="'+d.id+'">Edit</button> <button class="btn sm" data-act="ccreset" data-id="'+d.id+'" title="Reset phone login">Reset</button> <button class="btn sm danger" data-act="ccdel" data-id="'+d.id+'" aria-label="Delete driver">'+svg(IC_del)+'</button></td></tr>';}).join("")
    :'<tr><td colspan="9"><div class="empty" style="padding:24px"><h4>No driver accounts yet</h4><p>Add a driver to give them app access.</p></div></td></tr>';
  return '<div class="toolbar" style="margin-bottom:14px"><div class="search">'+svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>')+'<input id="ccSearch" placeholder="Search name, plate or phone…" value="'+esc(CC.f.search)+'" autocomplete="off"></div><span style="flex:1"></span><button class="btn primary sm" data-act="ccadd">'+svg('<path d="M12 5v14M5 12h14"/>')+'Add driver</button></div>'+
    '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Driver</th><th>ERP employee</th><th>Phone (login)</th><th>Platforms</th><th>Status</th><th>Device</th><th>PIN</th><th>Lifetime</th><th></th></tr></thead><tbody>'+tb+'</tbody></table></div>'+
    '<div class="banner info" style="margin-top:14px">'+svg('<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/>')+'<div style="font-size:12.5px">Drivers sign in on the app with their <b>phone number + 4-digit PIN</b>. A driver is linked to an ERP employee automatically when the phone matches the employee\'s mobile. <b>Reset phone</b> lets a driver sign in on a new device.</div></div>';
}
function ccDriverModal(id){
  var d=id?ccDrv(id):null;
  var emps=(STATE.grd.drivers||[]).filter(function(e){return e.name;}).slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  var pl=(d&&d.platforms)||["Talabat","Keeta"];
  var pin=d?d.pin:String(Math.floor(1000+Math.random()*9000));
  var ov=document.createElement("div");ov.className="overlay";ov.id="overlay";
  ov.innerHTML='<div class="modal" style="max-width:560px"><div class="modal-h"><div><h3>'+(d?"Edit driver":"Add driver")+'</h3><div class="sub">Driver app login · phone + PIN</div></div><button class="icon-btn" data-act="close" aria-label="Close">'+svg('<path d="M18 6 6 18M6 6l12 12"/>')+'</button></div>'+
    '<div class="modal-b"><div class="form-grid">'+
      '<div class="field wide"><label for="ccEmp">ERP employee</label><select id="ccEmp"><option value="">— pick an employee (fills the details) —</option>'+emps.map(function(e){return '<option value="'+esc(e.id)+'"'+(d&&d.employee_id===e.id?" selected":"")+'>'+esc(e.name)+(e.mobile?" · "+esc(e.mobile):"")+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label for="ccName">Name <span class="req">*</span></label><input id="ccName" value="'+esc(d?d.name:"")+'"></div>'+
      '<div class="field"><label for="ccPhone">Phone (login) <span class="req">*</span></label><input id="ccPhone" inputmode="tel" value="'+esc(d?d.phone||"":"")+'" placeholder="+965 5xxx xxxx"></div>'+
      '<div class="field"><label for="ccPin">4-digit PIN <span class="req">*</span></label><input id="ccPin" inputmode="numeric" maxlength="4" value="'+esc(pin)+'"></div>'+
      '<div class="field"><label for="ccPlate">Plate</label><input id="ccPlate" value="'+esc(d?d.plate||"":"")+'"></div>'+
      '<div class="field wide"><label for="ccModel">Vehicle model</label><input id="ccModel" value="'+esc(d?d.model||"":"")+'" placeholder="e.g. Bajaj Pulsar"></div>'+
      '<div class="field wide"><label>Platforms</label><div style="display:flex;gap:16px">'+CC_PLATFORMS.map(function(p){return '<label style="display:flex;gap:6px;align-items:center;font-weight:600"><input type="checkbox" class="ccPlat" value="'+p+'"'+(pl.indexOf(p)>=0?" checked":"")+'> '+p+'</label>';}).join("")+'</div></div>'+
    '</div><div class="err-msg" id="ccErr" hidden></div></div>'+
    '<div class="modal-f"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="ccsave" data-id="'+(id||"")+'">'+(d?"Save changes":"Add driver")+'</button></div></div>';
  document.body.appendChild(ov);
  var sel=ov.querySelector("#ccEmp");
  sel.addEventListener("change",function(){var e=(STATE.grd.drivers||[]).filter(function(x){return x.id===sel.value;})[0];if(!e)return;
    ov.querySelector("#ccName").value=e.name||"";if(e.mobile)ov.querySelector("#ccPhone").value=e.mobile;
    var v=(STATE.grd.vehicles||[]).filter(function(x){return String(x.driver||"").trim().toLowerCase()===String(e.name||"").trim().toLowerCase();})[0];
    if(v){ov.querySelector("#ccPlate").value=v.plate||"";ov.querySelector("#ccModel").value=((v.brand||"")+" "+(v.model||"")).trim();}});
  setTimeout(function(){sel.focus();},50);
}
function ccSaveDriver(id){
  var ov=document.getElementById("overlay");if(!ov)return;
  var v=function(s){return (ov.querySelector(s).value||"").trim();};
  var row={name:v("#ccName"),phone:v("#ccPhone"),pin:v("#ccPin"),plate:v("#ccPlate")||null,model:v("#ccModel")||null,
    platforms:Array.prototype.map.call(ov.querySelectorAll(".ccPlat:checked"),function(x){return x.value;}),employee_id:v("#ccEmp")||null};
  var err=ov.querySelector("#ccErr");
  var bad=!row.name?"Enter the driver's name.":(row.phone.replace(/\D/g,"").length<8)?"Enter a valid phone number (8+ digits).":!/^\d{4}$/.test(row.pin)?"PIN must be exactly 4 digits.":"";
  var dup=CC.drivers.filter(function(x){return String(x.id)!==String(id)&&String(x.phone||"").replace(/\D/g,"").slice(-8)===row.phone.replace(/\D/g,"").slice(-8);})[0];
  if(!bad&&dup)bad="Another driver ("+dup.name+") already uses this phone number.";
  if(bad){err.textContent=bad;err.hidden=false;return;}
  var btn=ov.querySelector('[data-act="ccsave"]');btn.disabled=true;
  var q=id?SB.from("drivers").update(row).eq("id",id).select():SB.from("drivers").insert(row).select();
  q.then(function(r){btn.disabled=false;
    if(r.error){err.textContent=r.error.message;err.hidden=false;return;}
    if(r.data&&r.data[0])ccApply("drivers",id?"UPDATE":"INSERT",r.data[0]);
    closeForm();toast(id?"Driver updated.":"Driver added — they can sign in with phone + PIN.","good");renderPage();
  });
}
function ccResetDevice(id){var d=ccDrv(id);if(!d)return;
  if(!confirm("Reset "+d.name+"'s phone login? They can then sign in on a new phone."))return;
  SB.from("drivers").update({active_device:null,failed_logins:0,locked_until:null}).eq("id",id).select().then(function(r){
    if(r.error){toast("Couldn't reset: "+r.error.message,"err");return;}
    SB.from("driver_sessions").delete().eq("driver_id",String(id)).then(function(){});
    if(r.data&&r.data[0])ccApply("drivers","UPDATE",r.data[0]);toast("Phone reset — driver can sign in on a new device.","good");renderPage();
  });}
function ccDeleteDriver(id){var d=ccDrv(id);if(!d)return;
  var has=CC.shifts.some(function(s){return String(s.driver_id)===String(id);})||CC.fuel.some(function(f){return String(f.driver_id)===String(id);});
  if(has){toast(d.name+" has shift/fuel history, so the account can't be deleted. Use Reset phone and change the PIN to block access.","err");return;}
  if(!confirm("Delete "+d.name+"'s app account? They will no longer be able to sign in."))return;
  SB.from("driver_sessions").delete().eq("driver_id",String(id)).then(function(){
    SB.from("drivers").delete().eq("id",id).then(function(r){
      if(r.error){toast("Couldn't delete: "+r.error.message,"err");return;}
      ccApply("drivers","DELETE",null,{id:id});toast("Driver removed.","good");renderPage();
    });
  });}
function ccExport(what){
  var q=function(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var lines=[];
  if(what==="fuel"){lines.push(["Date","Time","Driver","Plate","Station","Place","Amount KWD","Receipt"].join(","));
    CC.fuel.forEach(function(r){var d=ccDrv(r.driver_id);lines.push([r.date,r.time,d&&d.name,r.plate,r.station,r.place,r.cost,r.receipt_photo].map(q).join(","));});}
  else{var rows=what==="km"?ccDone():CC.shifts;
    lines.push(["Date","Driver","Plate","Platform","Status","Clock in","Login place","Clock out","Logout place","Start ODO","End ODO","Distance km","Orders","Cancelled","Duration"].join(","));
    rows.filter(ccPass).forEach(function(s){var d=ccDrv(s.driver_id);lines.push([s.date,d&&d.name,d&&d.plate,s.platform,s.status,s.login_time,s.login_place,s.logout_time,s.logout_place,s.start_odo,s.end_odo,s.distance,s.orders_done,s.orders_cancelled,s.duration].map(q).join(","));});}
  dlFile("﻿"+lines.join("\n"),"SMOU-"+what+"-"+ccToday()+".csv","text/csv");toast("Exported "+(lines.length-1)+" rows.","good");
}
/* events */
document.addEventListener("click",function(e){
  var a=e.target.closest("[data-act]");if(!a)return;var act=a.getAttribute("data-act"),id=a.getAttribute("data-id");
  if(act==="ccfollow")ccFollow(id);
  else if(act==="ccend")ccForceEnd(id);
  else if(act==="ccadd")ccDriverModal(null);
  else if(act==="ccedit")ccDriverModal(id);
  else if(act==="ccsave")ccSaveDriver(id||null);
  else if(act==="ccreset")ccResetDevice(id);
  else if(act==="ccdel")ccDeleteDriver(id);
  else if(act==="ccexport")ccExport(a.getAttribute("data-what"));
  else if(act==="ccreload"){CC.err="";CC.loaded=false;renderPage();}
  else if(act==="ccpin"){var d=ccDrv(id);if(d){a.textContent=a.textContent==="••••"?d.pin:"••••";}}
});
document.addEventListener("change",function(e){var s=e.target.closest("[data-ccf]");if(!s)return;CC.f[s.getAttribute("data-ccf")]=s.value;renderPage();});
var _ccS=null;document.addEventListener("input",function(e){if(e.target&&e.target.id==="ccSearch"){var v=e.target.value;clearTimeout(_ccS);_ccS=setTimeout(function(){CC.f.search=v;var pos=v.length;renderPage();var i=document.getElementById("ccSearch");if(i){i.focus();i.setSelectionRange(pos,pos);}},350);}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="ccBanner")go("cc/live");});

/* ===== Command Center v2: SOS alerts, vehicle checks, breaks, announcements (from driver app v2) ===== */
(function(){
  CC.sos=[];CC.checks=[];CC.ann=[];
  var _load=ccLoad;
  ccLoad=function(force){
    return _load(force).then(function(){
      if(!ccIsAdmin()||!CC.loaded||!SB)return;
      if(CC._x2&&!force)return;CC._x2=true;
      return Promise.all([
        SB.from("sos_alerts").select("*").order("created_at",{ascending:false}).limit(300),
        SB.from("vehicle_checks").select("*").order("created_at",{ascending:false}).limit(500),
        SB.from("announcements").select("*").order("created_at",{ascending:false}).limit(100)
      ]).then(function(r){
        if(!r[0].error)CC.sos=r[0].data||[];if(!r[1].error)CC.checks=r[1].data||[];if(!r[2].error)CC.ann=r[2].data||[];
        ccSosBar();
      }).catch(function(){});
    });
  };
  var _sub=ccSubscribe;
  ccSubscribe=function(){
    var had=!!CC.chan;
    if(!had&&SB){try{
      CC.chan=SB.channel("erp-command-center");
      ["drivers","shifts","fuel_records","shift_points","sos_alerts","vehicle_checks","announcements"].forEach(function(t){CC.chan.on("postgres_changes",{event:"*",schema:"public",table:t},ccOnRealtime);});
      CC.chan.subscribe();}catch(e){CC.chan=null;_sub();}}
  };
  var _apply=ccApply;
  ccApply=function(table,ev,nw,old){
    var arr={sos_alerts:CC.sos,vehicle_checks:CC.checks,announcements:CC.ann}[table];
    if(!arr)return _apply(table,ev,nw,old);
    if(ev==="DELETE"){var id=old&&old.id,i=arr.findIndex(function(x){return String(x.id)===String(id);});if(i>=0)arr.splice(i,1);return;}
    if(!nw)return;var j=arr.findIndex(function(x){return String(x.id)===String(nw.id);});if(j>=0)arr[j]=nw;else arr.unshift(nw);
  };
  var _rt=ccOnRealtime;
  ccOnRealtime=function(p){
    if(p.table==="sos_alerts"||p.table==="vehicle_checks"||p.table==="announcements"){
      ccApply(p.table,p.eventType,p.new,p.old);
      if(p.table==="sos_alerts"&&p.eventType==="INSERT"&&p.new){ccBeep();var d=ccDrv(p.new.driver_id);toast("SOS · "+((d&&d.name)||"Driver")+" · "+(p.new.type||""),"err");}
      if(p.table==="vehicle_checks"&&p.eventType==="INSERT"&&p.new&&!p.new.ok){var d2=ccDrv(p.new.driver_id);toast("Vehicle check problem · "+((d2&&d2.name)||"Driver"),"err");}
      ccSosBar();
      var r=getRoute();if(r==="cc/alerts"||r==="cc/announce"){if(!_rtBusy())renderPage();}
      return;
    }
    _rt(p);
  };
  function ccBeep(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var ac=new A();[0,.35,.7].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.22);});setTimeout(function(){try{ac.close();}catch(e){}},1500);}catch(e){}}
  function openSos(){return (CC.sos||[]).filter(function(s){return s.status==="OPEN";});}
  function mapLink(s){return s.lat!=null?'https://maps.google.com/?q='+s.lat+','+s.lng:"";}
  /* red SOS bar across every ERP page while any SOS is open */
  window.ccSosBar=ccSosBar;
  function ccSosBar(){
    var el=document.getElementById("ccSos");var list=ccIsAdmin()?openSos():[];
    if(!list.length){if(el)el.remove();return;}
    if(!el){el=document.createElement("div");el.id="ccSos";document.body.appendChild(el);}
    el.innerHTML=list.slice(0,3).map(function(s){var d=ccDrv(s.driver_id),ml=mapLink(s);
      return '<div class="ccsos-row"><i class="ccsos-dot"></i><b>SOS · '+esc((d&&d.name)||"Driver")+'</b><span>'+esc(s.type||"")+' · '+ccAgo(Date.parse(s.created_at))+(s.place?' · '+esc(s.place):"")+(s.note?' · “'+esc(s.note)+'”':"")+'</span>'+
        (d&&d.phone?'<a class="btn sm" href="tel:'+esc(d.phone)+'">Call</a>':"")+(ml?'<a class="btn sm" href="'+ml+'" target="_blank" rel="noopener">Map</a>':"")+
        '<button class="btn sm" data-route="cc/alerts">Open</button><button class="btn sm primary" data-act="ccsosres" data-id="'+esc(s.id)+'">Resolve</button></div>';}).join("")+
      (list.length>3?'<div class="ccsos-more">+'+(list.length-3)+' more open SOS</div>':"");
  }
  setInterval(function(){if(document.getElementById("ccSos"))ccSosBar();},30000);
  function resolveSos(id){
    if(!SB)return;var who=(USER&&USER.email)||"admin";
    SB.from("sos_alerts").update({status:"RESOLVED",resolved_at:new Date().toISOString(),resolved_by:who}).eq("id",id).then(function(r){
      if(r&&r.error){toast("Could not resolve: "+r.error.message,"err");return;}
      var s=CC.sos.filter(function(x){return String(x.id)===String(id);})[0];if(s){s.status="RESOLVED";s.resolved_at=new Date().toISOString();s.resolved_by=who;}
      ccSosBar();toast("SOS marked resolved.","good");if(getRoute()==="cc/alerts")renderPage();});
  }
  /* ---------- new Command Center pages ---------- */
  CC_TABS.push(["alerts","SOS & Checks"],["announce","Announcements"]);
  var _page=pageCC;
  pageCC=function(pg,tab){
    if(tab!=="alerts"&&tab!=="announce")return _page(pg,tab);
    setTitle("Command Center · "+(tab==="alerts"?"SOS & Checks":"Announcements"),"Live from the Sumou driver app");
    if(!ccIsAdmin()||!CC.loaded)return _page(pg,tab);
    ccTeardown();
    pg.innerHTML=tab==="alerts"?alertsPage():announcePage();
    if(LANG==="ar")transEl(pg);
  };
  function alertsPage(){
    var td=ccToday(),open=openSos(),wk=(CC.sos||[]).filter(function(s){return Date.now()-Date.parse(s.created_at)<7*86400000;});
    var chT=(CC.checks||[]).filter(function(c){return c.date===td;}),bad=chT.filter(function(c){return !c.ok;});
    var brk=ccActive().filter(function(s){return s.break_started_at;});
    var kpis='<div class="grid g4" style="margin-bottom:16px">'+ccKpi("Open SOS",open.length,wk.length+" in the last 7 days",open.length?"var(--crit)":"var(--good)")+ccKpi("Checks today",chT.length,(chT.length-bad.length)+" all OK","var(--teal)")+ccKpi("Check problems",bad.length,"sent to Maintenance as Pending","var(--amber)")+ccKpi("On break now",brk.length,ccActive().length+" on duty","var(--indigo)")+'</div>';
    var sosRows=(CC.sos||[]).slice(0,40).map(function(s){var d=ccDrv(s.driver_id),ml=mapLink(s),on=s.status==="OPEN";
      return '<tr><td>'+ccDrvCell(d)+'</td><td><span class="pill '+(on?"crit":"neutral")+'"><span class="pd"></span>'+esc(s.type||"")+'</span></td><td>'+esc(fmtD(String(s.created_at).slice(0,10)))+'<div class="sub">'+ccAgo(Date.parse(s.created_at))+'</div></td>'+
        '<td>'+esc(s.place||"—")+(ml?'<div class="sub"><a href="'+ml+'" target="_blank" rel="noopener">open map ↗</a></div>':"")+'</td><td style="white-space:normal;max-width:240px">'+esc(s.note||"—")+(s.incident_id?'<div class="sub">Incident record created</div>':"")+'</td>'+
        '<td>'+(on?'<button class="btn sm primary" data-act="ccsosres" data-id="'+esc(s.id)+'">Resolve</button>':'<span class="sub">Resolved '+(s.resolved_at?ccAgo(Date.parse(s.resolved_at)):"")+(s.resolved_by?' · '+esc(String(s.resolved_by).split("@")[0]):"")+'</span>')+'</td></tr>';}).join("");
    var chkRows=(CC.checks||[]).slice(0,60).map(function(c){var d=ccDrv(c.driver_id),badI=(c.items||[]).filter(function(i){return i&&i.ok===false;});
      return '<tr><td>'+ccDrvCell(d)+'</td><td>'+esc(fmtD(c.date))+'<div class="sub">'+new Date(c.created_at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kuwait"})+'</div></td><td><span class="tag-plate">'+esc(c.plate||"—")+'</span></td>'+
        '<td>'+(c.ok?'<span class="pill good"><span class="pd"></span>All OK</span>':badI.map(function(i){return '<span class="pill crit" style="margin:1px"><span class="pd"></span>'+esc(i.label||i.k)+'</span>';}).join(" "))+'</td><td style="white-space:normal;max-width:220px">'+esc(c.note||"—")+'</td><td>'+(c.photo?'<a class="chip" href="'+esc(c.photo)+'" target="_blank" rel="noopener">photo</a>':'<span class="sub">—</span>')+'</td></tr>';}).join("");
    var brkRows=brk.map(function(s){var d=ccDrv(s.driver_id);return '<div class="cc-live">'+ccDrvCell(d)+'<div class="cc-live-m"><span class="pill indigo"><span class="pd"></span>On break</span> <span class="sub">since '+ccAgo(Date.parse(s.break_started_at))+'</span></div></div>';}).join("");
    return kpis+
      '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>SOS alerts</h3><span class="hint">from the driver app · accidents, breakdowns and robbery also create an Incident record</span></div><div class="card-b">'+
        (sosRows?'<div class="tbl-wrap"><table class="dt"><thead><tr><th>Driver</th><th>Type</th><th>When</th><th>Where</th><th>Note</th><th></th></tr></thead><tbody>'+sosRows+'</tbody></table></div>':'<div class="empty" style="padding:18px"><p>No SOS alerts.</p></div>')+'</div></div>'+
      '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Daily vehicle checks</h3><span class="hint">problems go to Fleet → Maintenance as Pending</span></div><div class="card-b">'+
        (chkRows?'<div class="tbl-wrap"><table class="dt"><thead><tr><th>Driver</th><th>Date</th><th>Plate</th><th>Result</th><th>Note</th><th>Photo</th></tr></thead><tbody>'+chkRows+'</tbody></table></div>':'<div class="empty" style="padding:18px"><p>No checks yet.</p></div>')+'</div></div>'+
      '<div class="card"><div class="card-h"><h3>On break now</h3><span class="hint">GPS stays on during breaks</span></div><div class="card-b">'+(brkRows||'<div class="empty" style="padding:18px"><p>Nobody is on a break.</p></div>')+'</div></div>';
  }
  function announcePage(){

/* ===== Command Center: accurate live location (full trails, stale ticker, realtime auto-reconnect, polling backup) ===== */
(function(){

  var POLL_MS=15000, TICK_MS=10000;

          CC.chan=null;clearTimeout(retryT);retryT=setTimeout(function(){if(!CC.chan&&ccIsAdmin())ccSubscribe();},5000);
        }

    }catch(e){CC.chan=null;CC.rt="down";}
  };
  function paintRt(){var el=document.getElementById("ccRt");if(el)el.outerHTML=rtBadge();}

  /* after a dropped connection: reload everything once so nothing that happened meanwhile is missed */

      else if(r==="overview"){var b=document.getElementById("ccBanner");if(b)b.outerHTML=ccBannerHTML();}
      if(window.ccSosBar)window.ccSosBar();
    });
  }
  /* ---- polling backup: re-reads running shifts so nothing is missed if the socket drops ---- */
  var polling=false,lastTrail=0;
  function ccPoll(withTrails){
    if(polling||!ccIsAdmin()||!CC.loaded||!SB)return;
    var r=getRoute();if(r.indexOf("cc/")!==0&&r!=="overview")return;
    polling=true;
    var ids=ccActive().map(function(s){return String(s.id);});
    var q=SB.from("shifts").select("*");
    q=ids.length?q.or("status.eq.ACTIVE,id.in.("+ids.join(",")+")"):q.eq("status","ACTIVE");
    q.then(function(res){
      polling=false;if(res.error||!res.data)return;CC.lastSync=Date.now();
      res.data.forEach(function(row){
        var prev=shiftById(row.id);
        if(!prev){ccOnRealtime({table:"shifts",eventType:"INSERT",new:row,old:null});return;}
        if(prev.status!==row.status||prev.live_at!==row.live_at||prev.live_lat!==row.live_lat||prev.live_lng!==row.live_lng||prev.break_started_at!==row.break_started_at)
          ccOnRealtime({table:"shifts",eventType:"UPDATE",new:row,old:{id:row.id}});

/* ===== Remember the signed-in role so admin tabs (Command, Admin) show instantly on refresh ===== */
(function(){
  var KEY="smou-role";
  function hasSession(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)&&localStorage.getItem(k))return true;}}catch(e){}return false;}
  var cached=null;try{cached=localStorage.getItem(KEY);}catch(e){}
  /* while the saved session is being checked (1–2 s), draw the menu for the last known role.
     Data access is still decided by the database (RLS) — this only affects what the menu shows. */
  if(SB_ON&&cached&&hasSession()&&/^(admin|dataentry|viewer)$/.test(cached)){ROLE=cached;READONLY=true;}
  var _apply=applyRole;
  applyRole=function(){
    _apply();
    if(USER){try{localStorage.setItem(KEY,ROLE);}catch(e){}}
    /* the real role is known now: load the Command Center and repaint a Command page that was waiting */
    if(USER&&ROLE==="admin"&&typeof ccLoad==="function"){
      ccLoad().then(function(){var r=getRoute();if(r.indexOf("cc/")===0&&!_rtBusy())renderPage();});
    }
  };
  var _out=doLogout;
  doLogout=function(){try{localStorage.removeItem(KEY);}catch(e){}return _out.apply(this,arguments);};
  /* Command Center data needs the real signed-in session, not the remembered role */
  var _isAdm=ccIsAdmin;
  ccIsAdmin=function(){return _isAdm()&&!!USER;};
  var _pcc=pageCC;
  pageCC=function(pg,tab){
    if(SB_ON&&!USER&&ROLE==="admin"){
      setTitle("Command Center","Live from the Sumou driver app");ccTeardown();
      pg.innerHTML='<div class="card"><div class="empty" style="padding:40px"><h4>Loading live driver data…</h4><p>Connecting to the fleet.</p></div></div>';
      return;
    }
    return _pcc(pg,tab);
  };
})();
