function regFields(ent){return ENT[ent].fields.filter(function(f){return !f.g;});}
function slug(s){return s.replace(/[^a-z0-9]+/gi,"_").toLowerCase().replace(/^_|_$/g,"");}
function xlsxReady(){return typeof XLSX!=="undefined";}
function buildAOA(ent,withData,rows){
  var fs=regFields(ent);var aoa=[["Reference ID"].concat(fs.map(function(f){return f.l;}))];
  if(withData)(rows||store(ent)).forEach(function(r){aoa.push([r.id||""].concat(fs.map(function(f){
    var v=r[f.k];
    if(f.t==="file")return (v&&typeof v==="object")?(v.url||v.name||""):"";
    return v==null?"":v;
  })));});
  return aoa;
}
function makeWB(ent,withData,rows){
  var ws=XLSX.utils.aoa_to_sheet(buildAOA(ent,withData,rows));
  var fs=regFields(ent);ws["!cols"]=[{wch:16}].concat(fs.map(function(f){return {wch:Math.max(10,Math.min(28,f.l.length+3))};}));
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,ENT[ent].title.slice(0,31));return wb;
}
function csvFrom(ent,withData,rows){
  var aoa=buildAOA(ent,withData,rows);
  return "﻿"+aoa.map(function(row){return row.map(function(v){v=(v==null?"":String(v));return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\r\n");
}
function saveSheet(ent,withData,rows){
  if(!xlsxReady()){toast("Excel engine still loading — try again in a moment.","err");return;}
  var base=slug(ENT[ent].title)+(rows?"_selected_"+isoToday():(withData?"_"+isoToday():"_template"));
  var wb=makeWB(ent,withData,rows);
  var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  var u8=new Uint8Array(buf);
  var xlsxMime="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  function blobSave(){try{var blob=new Blob([u8],{type:xlsxMime});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=base+".xlsx";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},150);toast((withData?"Exported ":"Template ")+base+".xlsx","good");}catch(e){toast("Download not supported in this view.","err");}}
  if(window.claude&&claude.use){
    claude.use("downloads").then(function(dl){
      if(!dl){blobSave();return;}
      dl.save({filename:base+".xlsx",data:u8.buffer.slice(0)}).then(function(){toast("Saved "+base+".xlsx","good");})
      .catch(function(err){var c=(err&&err.code)||"";
        if(c==="declined")return;
        if(c==="rejected_extension"||c==="extension_not_enabled"){ // xlsx not allowed in this viewer → Excel-compatible CSV
          dl.save({filename:base+".csv",data:csvFrom(ent,withData,rows)}).then(function(){toast("Saved "+base+".csv (opens in Excel)","good");}).catch(function(e2){if((e2&&e2.code)!=="declined")blobSave();});
        } else blobSave();
      });
    }).catch(blobSave);
  } else blobSave();
}
/* ============ REPORTS & EXPORT ============ */
function dlFile(data,filename,mime){try{var blob=new Blob([data],{type:mime||"application/octet-stream"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},150);}catch(e){toast("Download not supported in this view.","err");}}
function backupJSON(){var data=JSON.stringify({app:"SMOU Fleet ERP",exportedAt:new Date().toISOString(),state:STATE},null,2);dlFile(data,"SMOU-Fleet-Backup_"+isoToday()+".json","application/json");toast("Backup downloaded.","good");}
function exportAllExcel(){
  if(!xlsxReady()){toast("Excel engine still loading — try again in a moment.","err");return;}
  var wb=XLSX.utils.book_new(),used={};
  Object.keys(ENT).forEach(function(ent){
    var fs=regFields(ent),rows=store(ent)||[];
    var aoa=[fs.map(function(f){return f.l;})];
    rows.forEach(function(r){aoa.push(fs.map(function(f){var v=r[f.k];return v==null?"":(typeof v==="object"?"":v);}));});
    var nm=(ENT[ent].title||ent).replace(/[\\\/\?\*\[\]:]/g,"").slice(0,28);var base=nm,i=2;while(used[nm]){nm=base.slice(0,26)+" "+i;i++;}used[nm]=1;
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),nm);
  });
  var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  dlFile(new Uint8Array(buf),"SMOU-Fleet-AllData_"+isoToday()+".xlsx","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
  toast("Exported all data to Excel.","good");
}
function monthlyReportPDF(){
  var doc=pdfNew();if(!doc)return;var tm=mKeyOf(TODAY);
  var d=STATE.grd.drivers,V=STATE.grd.vehicles;
  var st=countBy(d,function(x){return x.status;});
  var hc=STATE.grd.housing.reduce(function(a,b){return a+(num(b.cap)||0);},0),ha=STATE.grd.housing.reduce(function(a,b){return a+(num(b.actual)||0);},0);
  var al=computeAlerts();var alExp=al.filter(function(a){return a.kind==="km"?a.overdue:a.days<0;}).length;
  var inc=(STATE.finance.income||[]).filter(function(e){return mKey(e)===tm;}).reduce(function(a,b){return a+(num(b.amount)||0);},0);
  var exp=(STATE.finance.expenses||[]).filter(function(e){return mKey(e)===tm;}).reduce(function(a,b){return a+eAmt(b);},0);
  var pay=(STATE.finance.payroll||[]).filter(function(pr){return payMK(pr)===tm;}).reduce(function(a,b){return a+netPay(b);},0);
  var H=STATE.grd.hiring||[];var ready=H.filter(function(r){return hireProgress(r).pct>=100;}).length;var avg=H.length?Math.round(H.reduce(function(a,r){return a+hireProgress(r).pct;},0)/H.length):0;
  var y=pdfHead(doc,"Monthly Fleet & Finance Report",prettyMonth(tm));
  y=pdfSection(doc,y,"Workforce");
  y=pdfKV(doc,y,[["Total Employees",String(d.length)],["Active",String(st["ACTIVE"]||0)],["In Process",String(st["IN PROCESS"]||0)],["Vehicles",String(V.length)],["Housing Beds",ha+" / "+hc]]);
  y=pdfSection(doc,y,"Alerts & Compliance");
  y=pdfKV(doc,y,[["Total Alerts (30 days)",String(al.length)],["Expired / Overdue",String(alExp)]]);
  y=pdfSection(doc,y,"Finance — "+prettyMonth(tm));
  y=pdfKV(doc,y,[["Income",money(inc)+" KWD"],["Expenses",money(exp)+" KWD"],["Payroll",money(pay)+" KWD"],["Net Profit",money(inc-exp-pay)+" KWD"]]);
  y=pdfSection(doc,y,"Hiring");
  y=pdfKV(doc,y,[["Candidates in pipeline",String(H.length)],["Fully Ready",String(ready)],["Avg Onboarding",avg+"%"]]);
  pdfFoot(doc);doc.save("SMOU-Monthly-Report_"+tm+".pdf");toast("Monthly report downloaded.","good");
}
function expiryReportPDF(){
  var doc=pdfNew();if(!doc)return;
  var al=computeAlerts().filter(function(a){return a.kind==="date";}).sort(function(a,b){return a.days-b.days;});
  var y=pdfHead(doc,"Document Expiry Report","Expired + expiring within 30 days");
  if(!al.length){y=pdfKV(doc,y+6,[["Status","All documents valid — nothing expiring within 30 days."]]);}
  else{y=pdfSection(doc,y,al.length+" document(s)");y=pdfKV(doc,y,al.map(function(a){var when=a.days<0?(Math.abs(a.days)+"d ago"):(a.days+"d left");return [a.title+(a.sub?" — "+a.sub:""),when+"  ("+a.date.getDate()+" "+MONS[a.date.getMonth()]+" "+a.date.getFullYear()+")"];}));}
  pdfFoot(doc);doc.save("SMOU-Expiry-Report_"+isoToday()+".pdf");toast("Expiry report downloaded.","good");
}
function pageReports(pg){

  function rc(icon,title,desc,act,btn){return '<div class="card"><div class="card-b" style="display:flex;gap:14px;align-items:flex-start"><span style="width:40px;height:40px;border-radius:11px;background:var(--teal-bg);color:var(--teal-ink);display:grid;place-items:center;flex:none">'+svg(icon)+'</span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:15px">'+title+'</div><div class="sub" style="font-size:12.5px;color:var(--muted);margin:3px 0 12px">'+desc+'</div><button class="btn sm primary" data-act="'+act+'">'+btn+'</button></div></div></div>';}
  pg.innerHTML='<div class="grid g2" style="align-items:start">'+
    rc('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 18h4"/>',"Monthly Report (PDF)","This month’s workforce, alerts, finance P&amp;L and hiring — in one PDF.","rptmonthly","Download PDF")+
    rc('<path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',"Document Expiry Report (PDF)","Every expired document + everything expiring within 30 days.","rptexpiry","Download PDF")+
    rc('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',"Full Backup (JSON)","A complete copy of all your data — keep it safe.","rptbackup","Download Backup")+

document.addEventListener("click",function(e){var a=e.target.closest("[data-act]");if(!a)return;var act=a.getAttribute("data-act");

function importSheet(ent,arraybuffer){
  if(!can("edit")){toast("You don't have permission to import.","err");return;}
  if(!xlsxReady()){toast("Excel engine still loading — try again in a moment.","err");return;}
  var aoa;
  try{var wb=XLSX.read(new Uint8Array(arraybuffer),{type:"array"});var ws=wb.Sheets[wb.SheetNames[0]];aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",blankrows:false});}
  catch(e){toast("Couldn't read that file. Use an Excel (.xlsx) or CSV file.","err");return;}
  if(!aoa||aoa.length<2){toast("No data rows found in the file.","err");return;}
  var fs=regFields(ent),cfg=ENT[ent];
  var header=aoa[0].map(function(h){return String(h==null?"":h).trim().toLowerCase();});
  var map=header.map(function(h){
    if(h==="reference id"||h==="ref id"||h==="reference"||h==="refid"||h==="id")return "__refid__";
    var f=fs.filter(function(x){return x.l.toLowerCase()===h||x.k.toLowerCase()===h;})[0];return f?f.k:null;});
  if(!map.some(function(x){return x&&x!=="__refid__";})){toast("Columns didn't match. Use the blank template's headings.","err");return;}
  var added=0,updated=0;
  for(var i=1;i<aoa.length;i++){var r=aoa[i],rec={},any=false,refid="";
    for(var j=0;j<r.length;j++){var k=map[j];if(!k)continue;var v=r[j]==null?"":(typeof r[j]==="number"?String(r[j]):String(r[j]).trim());
      if(k==="__refid__"){refid=v;continue;}rec[k]=v;if(v)any=true;}
    if(!any&&!refid)continue;
    if(refid){var ex=store(ent).filter(function(x){return x.id===refid;})[0];
      if(ex){if(!any)continue;var chg=diffRec(cfg,ex,rec);Object.assign(ex,rec);logAudit("edit",ent,ex.id,recLabel(ent,ex),chg);updated++;continue;}
      // reference id given but not found → create WITH that id so it stays stable for future imports
      if(!any)continue;rec.id=refid;store(ent).unshift(rec);logAudit("add",ent,rec.id,recLabel(ent,rec),[]);added++;continue;}
    rec.id=uid(cfg.idp);store(ent).unshift(rec);logAudit("add",ent,rec.id,recLabel(ent,rec),[]);added++;}
  if(!added&&!updated){toast("Nothing to import.","err");return;}
  persist();renderApp();
  toast("Import done — "+added+" new"+(updated?", "+updated+" updated":"")+" in "+ENT[ent].title+".","good");
}
document.addEventListener("click",function(e){
  var ab=e.target.closest("[data-actbtn]");
  if(ab){var pop=ab.parentNode.querySelector(".ms-pop");var open=!pop.hidden;closeAllMS();if(!open)pop.hidden=false;return;}
  var mi=e.target.closest("[data-actexport],[data-acttemplate],[data-actimport]");
  if(mi){var ent=curEnt;closeAllMS();
    if(mi.hasAttribute("data-actexport"))saveSheet(ent,true);
    else if(mi.hasAttribute("data-acttemplate"))saveSheet(ent,false);
    else if(mi.hasAttribute("data-actimport")){var fi=document.getElementById("importFile");if(fi)fi.click();}
  }
});
